name: slack-integration
description: Creates a Slack message based on the test results.
inputs:
    AG_LIBRARY:
        description: 'AG library'
        required: true
        type: choice
        options:
            - grid
            - charts
            - studio
    SLACK_BOT_OAUTH_TOKEN:
        description: 'Slack OAuth token for sending messages'
        required: true
    SLACK_CHANNEL:
        description: 'Slack channel to send messages'
        required: true
    CTRF_REPORT_FILE:
        description: 'Path to the CTRF report file'
        required: false
    CURRENT_COMMIT_SHA:
        description: 'Current/Variant commit SHA being tested'
        required: false
    PREV_COMMIT_SHA:
        description: 'Base/Control commit SHA to compare against'
        required: false
    IS_SUCCESS:
        description: 'Indicates if the workflow run was successful'
        required: false
        default: 'true'
    IS_REPEAT_FAILURE:
        description: >-
            Set to 'true' when the previous run of this workflow also failed. The message then
            carries only the header and the test counts: no pull request attribution and no
            @-mentions, so one break notifies the channel in full once rather than once per run
            for as long as it stays red.
        required: false
        default: 'false'
    GITHUB_TOKEN:
        description: >-
            GitHub token used to resolve the pull requests between PREV_COMMIT_SHA and
            CURRENT_COMMIT_SHA. Supply it together with the NOTION_* inputs to have the message
            name those PRs and @-mention their authors; without it the message is unchanged.
            Needs `pull-requests: read` on a private repo.
        required: false
    NOTION_API_TOKEN:
        description: 'Notion API token for the Slack user directory that maps a GitHub login to a Slack ID.'
        required: false
    NOTION_DATA_SOURCE_ID:
        description: 'Notion data source id holding the Slack user directory.'
        required: false
    NOTION_API_VERSION:
        description: 'Notion API version.'
        required: false
        default: '2026-03-11'
runs:
    using: composite
    steps:
        - name: Get last failed step
          id: last-failed-step
          if: ${{ failure() }}
          continue-on-error: true
          uses: ./external/ag-shared/github/actions/get-last-failed-step
          with:
              JOB_ID: ${{ github.run_id }}
              REPO_NAME: ${{ github.repository }}

        - name: Convert ctrf output to Slack message blocks
          env:
              AG_LIBRARY: ${{ inputs.AG_LIBRARY }}
              CTRF_REPORT_FILE: ${{ inputs.CTRF_REPORT_FILE }}
              WORKFLOW_NAME: ${{ github.workflow }}
              JOB_ID: ${{ github.run_id }}
              CURRENT_COMMIT_SHA: ${{ inputs.CURRENT_COMMIT_SHA }}
              PREV_COMMIT_SHA: ${{ inputs.PREV_COMMIT_SHA }}
              SLACK_FILE: /tmp/slack.json
              REPO_URL: ${{ github.server_url }}/${{ github.repository }}
              BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
              SLACK_CHANNEL: ${{ inputs.SLACK_CHANNEL }}
              SLACK_ICON: 'https://avatars.slack-edge.com/2020-11-25/1527503386626_319578f21381f9641cd8_192.png'
              SLACK_USERNAME: 'ag-grid CI'
              IS_SUCCESS: ${{ inputs.IS_SUCCESS == 'true' && !steps.last-failed-step.outputs.failed_step }}
              IS_REPEAT_FAILURE: ${{ inputs.IS_REPEAT_FAILURE }}
              LAST_FAILED_STEP: ${{ steps.last-failed-step.outputs.failed_step }}
              GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
              NOTION_API_TOKEN: ${{ inputs.NOTION_API_TOKEN }}
              NOTION_DATA_SOURCE_ID: ${{ inputs.NOTION_DATA_SOURCE_ID }}
              NOTION_API_VERSION: ${{ inputs.NOTION_API_VERSION }}
          shell: bash
          run: |
              node ./external/ag-shared/scripts/ci/gen-slack-blocks.mjs
              cat $SLACK_FILE
              {
                echo 'SLACK_MESSAGE_BLOCKS<<EOF'
                cat $SLACK_FILE
                echo 'EOF'
              } >> $GITHUB_ENV

        - name: Create Slack Message
          shell: bash
          env:
              SLACK_BOT_OAUTH_TOKEN: ${{ inputs.SLACK_BOT_OAUTH_TOKEN }}
              SLACK_MESSAGE_BLOCKS: ${{ env.SLACK_MESSAGE_BLOCKS }}
          run: |
              node ./external/ag-shared/scripts/slack/send-slack-message-command.mjs
