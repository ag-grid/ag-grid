name: 'Install @ag-grid/dev-prompts'
description: >
    Install the @ag-grid/dev-prompts npm package from GitHub Packages so the
    composite actions shipped inside it (jira-pipeline, jira-ci-failure-preflight,
    etc.) can be consumed via local-path `uses:` references. Required because
    ag-dev-prompts is a private repo and the runner's GITHUB_TOKEN cannot resolve
    `uses: ag-grid/ag-dev-prompts/...` cross-repo, but GitHub Packages honours the
    same token with `packages: read`.

    Shared across AG consumer repos (ag-charts, ag-grid, ag-studio) via the
    ag-shared subrepo — reference it as
    `./external/ag-shared/github/actions/install-ag-dev-prompts`. The engine
    actions themselves stay on the npm package (channel-pinned); only this thin
    install glue is shared.

inputs:
    channel:
        description: 'npm dist-tag to install (e.g. canary, latest)'
        required: true
    github-token:
        description: 'Token with packages:read scope'
        required: false
        default: ${{ github.token }}
    node-version:
        description: >
            Optional explicit Node version. Defaults to empty, in which case the
            consumer repo's root package.json (engines.node / volta) is used via
            node-version-file. Set this only if a repo has no resolvable version
            in package.json.
        required: false
        default: ''

runs:
    using: composite
    steps:
        - name: Setup Node (GitHub Packages for @ag-grid scope)
          uses: actions/setup-node@v4
          with:
              node-version: ${{ inputs.node-version || '' }}
              node-version-file: ${{ inputs.node-version == '' && 'package.json' || '' }}
              registry-url: https://npm.pkg.github.com
              scope: '@ag-grid'

        - name: Install @ag-grid/dev-prompts@${{ inputs.channel }}
          shell: bash
          env:
              NODE_AUTH_TOKEN: ${{ inputs.github-token }}
              DEV_PROMPTS_CHANNEL: ${{ inputs.channel }}
          run: |
              set -euo pipefail
              mkdir -p "$GITHUB_WORKSPACE/.ag-dev-prompts"
              cd "$GITHUB_WORKSPACE/.ag-dev-prompts"
              echo '{"name":"ag-dev-prompts-install","private":true}' > package.json
              npm install --no-save --silent "@ag-grid/dev-prompts@${DEV_PROMPTS_CHANNEL}"
