<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component Framework Demos</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 40px;
        background: #f5f5f5;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 24px;
        color: #333;
      }
      .demo-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 400px;
      }
      .demo-list a {
        display: block;
        padding: 16px 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-decoration: none;
        color: #1976d2;
        font-size: 16px;
        font-weight: 500;
        transition: box-shadow 0.15s, transform 0.15s;
      }
      .demo-list a:hover {
        box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <h1>Component Framework Demos</h1>
    <ul class="demo-list">
      <li><a href="/grid/">Grid Demo</a></li>
      <li><a href="/reorder/">Reordering Demo</a></li>
    </ul>
  </body>
</html>
