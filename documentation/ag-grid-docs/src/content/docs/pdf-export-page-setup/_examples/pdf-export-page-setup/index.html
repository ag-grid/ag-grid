<div class="example-wrapper">
    <div class="controls example-controls" onchange="onPdfExportOptionsChanged()">
        <div class="controls-row">
            <button onclick="onBtExport()">Export to PDF</button>
            <label>
                Page size
                <select id="pageSize">
                    <option value="A4">A4</option>
                    <option value="Letter">Letter</option>
                    <option value="custom">Custom small page</option>
                </select>
            </label>
            <label>
                Orientation
                <select id="orientation">
                    <option value="landscape">Landscape</option>
                    <option value="portrait">Portrait</option>
                </select>
            </label>
            <label>
                Margins
                <select id="margin">
                    <option value="standard">Standard</option>
                    <option value="compact">Compact</option>
                    <option value="wide">Wide</option>
                </select>
            </label>
            <label><input id="repeatHeader" type="checkbox" checked /> Repeat table headers</label>
        </div>
    </div>
    <div id="myGrid"></div>
</div>
