<div class="example-wrapper">
    <div class="controls">
        <button onclick="onBtExport()">Export to PDF</button>
        <label for="columnSet">Columns</label>
        <select id="columnSet" onchange="onExportOptionsChanged()">
            <option value="visible">Visible</option>
            <option value="all">All, including hidden</option>
            <option value="specific">Customer, Product and Total</option>
        </select>
        <label
            ><input id="skipColumnGroupHeaders" type="checkbox" onchange="onExportOptionsChanged()" /> Skip group
            headers</label
        >
        <label><input id="skipColumnHeaders" type="checkbox" onchange="onExportOptionsChanged()" /> Skip headers</label>
        <label
            ><input id="exportRowNumbers" type="checkbox" onchange="onExportOptionsChanged()" /> Export row
            numbers</label
        >
    </div>
    <div id="myGrid"></div>
</div>
