<div class="test-container">
    <div class="test-header example-controls">
        <div class="controls-row">
            <div class="button-group" role="group" aria-label="Age filter">
                <input type="radio" name="filter" id="everyone" checked onchange="externalFilterChanged('everyone')" />
                <label for="everyone">Everyone</label>
                <input type="radio" name="filter" id="below25" onchange="externalFilterChanged('below25')" />
                <label for="below25">Below 25</label>
                <input
                    type="radio"
                    name="filter"
                    id="between25and50"
                    onchange="externalFilterChanged('between25and50')"
                />
                <label for="between25and50">Between 25 and 50</label>
                <input type="radio" name="filter" id="above50" onchange="externalFilterChanged('above50')" />
                <label for="above50">Above 50</label>
                <input
                    type="radio"
                    name="filter"
                    id="dateAfter2008"
                    onchange="externalFilterChanged('dateAfter2008')"
                />
                <label for="dateAfter2008">After 01/01/2008</label>
            </div>
        </div>
    </div>
    <div id="myGrid" style="height: 100%"></div>
</div>
