<div class="example-wrapper example-wrapper--auto-height">
    <div class="example-controls">
        <div class="controls-row">
            <label for="row-count"
                >Rows <input id="row-count" type="number" min="0" max="50" value="5" oninput="onRowCountChanged()"
            /></label>
            <label class="gap-left" for="min-body-height"
                >autoHeightMinBodyHeight
                <input
                    id="min-body-height"
                    type="number"
                    min="0"
                    max="600"
                    step="10"
                    value="100"
                    oninput="onMinBodyHeightChanged()"
            /></label>
            <label class="gap-left" for="max-body-height"
                >autoHeightMaxBodyHeight (blank for none)
                <input
                    id="max-body-height"
                    type="number"
                    min="0"
                    max="600"
                    step="10"
                    value="250"
                    oninput="onMaxBodyHeightChanged()"
            /></label>
        </div>
    </div>
    <div id="myGrid"></div>
</div>

<div class="under-grid">
    <p>This text sits under the grid and moves up and down as the grid resizes to fit its rows.</p>
</div>
