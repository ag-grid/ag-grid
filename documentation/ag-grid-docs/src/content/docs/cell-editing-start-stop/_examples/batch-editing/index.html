<div class="example-wrapper">
    <div class="example-buttons">
        <div class="example-button-row">
            <div>Edit Strategy:</div>
            <button onclick="updateStrategy('cellEditMode')">Single Cell (default)</button>
            <button onclick="updateStrategy('rowEditMode')">Full Row</button>
            <button onclick="updateStrategy('batchEditMode')">Batch Edit</button>
        </div>
        <div class="example-button-row">
            <span>Edit Trigger: </span>
            <button onclick="updateTrigger('defaultEditTrigger')">Default (full keyboard, double-click)</button>
            <button onclick="updateTrigger('suppressClickEdit')">Suppress click Edit</button>
            <button onclick="updateTrigger('singleClickEditTrigger')">Single-click Edit</button>
            <button onclick="updateTrigger('doubleClickEditTrigger')">Double-click Edit</button>
        </div>
        <div class="example-button-row">
            <span>API: </span>
            <button onclick="onBtStartEditing(undefined)">Edit (1)</button>
            <button onclick="stopEdit()">Stop Edit</button>
            <button onclick="enableBatchEdit()">Batch Edit</button>
            <button onclick="commitEdit()">Commit Batch</button>
            <button onclick="cancelEdit()">Cancel Batch</button>
        </div>
    </div>
    <div class="grid-wrapper">
        <div id="myGrid"></div>
    </div>
</div>
