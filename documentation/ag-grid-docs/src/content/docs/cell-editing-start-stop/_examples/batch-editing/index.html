<div class="example-wrapper">
    <div class="example-buttons">
        <div class="example-button-row">
            <div>Edit Strategy:</div>
            <label><input type="radio" id="singleCell" onclick="setEditType(undefined)" checked>Single Cell (default)</input></label>
            <label><input type="radio" id="fullRow" onclick="setEditType('fullRow')">Full Row</input></label>
        </div>
        <div class="example-button-row">
            <span>API: </span>
            <button onclick="onBtStartEditing()">Edit (1, Last Name)</button>
            <button id="enableBatch" onclick="setBatch(true)">Enable Batch Edits</button>
            <button id="disableBatch" onclick="setBatch(false)">Disable Batch Edits</button>
            <button id="stopEdit" onclick="stopEdit()">Stop Edits</button>
            <button id="cancelEdit" onclick="cancelEdit()">Cancel Edits</button>
            <button id="getPending" onclick="getPendingUpdates()">Get Pending Edits</button>
            <button id="setPending" onclick="setPendingUpdates()">Set Pending Edits</button>
            <button id="setPending" onclick="setPendingUpdates(true)">Set Pending Edits (empty values)</button>
            <button id="clearPending" onclick="clearPendingUpdates()">Clear Pending Edits</button>
        </div>
        <div class="example-button-row">
            <span>Utility: </span>
            <button id="enablePoll" onclick="pollPendingEdits()">Poll Pending Edits</button>
            <button id="disablePoll" onclick="pollPendingEdits()">Stop Polling</button>
        </div>
    </div>
    <div class="grid-wrapper">
        <div id="myGrid"></div>
    </div>
</div>
