<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px">
    <label for="widthSlider">Grid width:</label>
    <input
        type="range"
        id="widthSlider"
        min="300"
        max="1400"
        value="1400"
        style="flex: 1"
        oninput="onWidthSliderChange(this.value)"
    />
    <span id="widthValue">1400px</span>
</div>
<div id="myGrid" style="height: calc(100% - 40px)"></div>
