<div class="example-wrapper">
    <div class="example-controls" style="margin-bottom: 10px">
        <div class="controls-row">
            <label>
                <span>Select All Mode: </span>
                <select id="select-all-mode" onchange="updateSelectAllMode()">
                    <option value="all">all</option>
                    <option value="filtered">filtered</option>
                    <option value="currentPage">currentPage</option>
                </select>
            </label>
            <label>
                <span>Filter: </span>
                <input type="text" oninput="onQuickFilterChanged()" id="quickFilter" placeholder="quick filter..." />
            </label>
        </div>
    </div>
    <div id="myGrid" style="height: 100%"></div>
</div>
