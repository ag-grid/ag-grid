        <div class="controls-row">
            <span>Cards:</span>
            <button onclick="showAthleteCountryYear()">Show Athlete, Country, Year</button>
            <button onclick="expandAll()">Expand All</button>

            <button onclick="clearFilterValues()">Clear Filter Values</button>
