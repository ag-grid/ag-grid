<div class="example-wrapper">
    <div class="example-controls">
        <div class="controls-row">
            <fieldset class="controls-section">
                <legend>Header</legend>
                <div class="controls-row">
                    <label>
                        Position
                        <select id="headerPosition">
                            <option>Left</option>
                            <option>Center</option>
                            <option>Right</option>
                        </select>
                    </label>
                </div>
                <div class="controls-row">
                    <span>Font</span>
                    <select id="headerFontName" aria-label="Header font name">
                        <option>Calibri</option>
                        <option>Arial</option>
                    </select>
                    <select id="headerFontSize" aria-label="Header font size">
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>16</option>
                        <option>20</option>
                    </select>
                    <select id="headerFontWeight" aria-label="Header font weight">
                        <option>Regular</option>
                        <option>Bold</option>
                        <option>Italic</option>
                        <option>Bold Italic</option>
                    </select>
                    <label>
                        <input type="checkbox" id="headerUnderline" />
                        <u>U</u>
                    </label>
                </div>
                <div class="controls-row">
                    <label>
                        Value
                        <input type="text" id="headerValue" />
                    </label>
                </div>
            </fieldset>
            <fieldset class="controls-section">
                <legend>Footer</legend>
                <div class="controls-row">
                    <label>
                        Position
                        <select id="footerPosition">
                            <option>Left</option>
                            <option>Center</option>
                            <option>Right</option>
                        </select>
                    </label>
                </div>
                <div class="controls-row">
                    <span>Font</span>
                    <select id="footerFontName" aria-label="Footer font name">
                        <option>Calibri</option>
                        <option>Arial</option>
                    </select>
                    <select id="footerFontSize" aria-label="Footer font size">
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>16</option>
                        <option>20</option>
                    </select>
                    <select id="footerFontWeight" aria-label="Footer font weight">
                        <option>Regular</option>
                        <option>Bold</option>
                        <option>Italic</option>
                        <option>Bold Italic</option>
                    </select>
                    <label>
                        <input type="checkbox" id="footerUnderline" />
                        <u>U</u>
                    </label>
                </div>
                <div class="controls-row">
                    <label>
                        Value
                        <input type="text" id="footerValue" />
                    </label>
                </div>
            </fieldset>
        </div>
        <div class="controls-row">
            <button onclick="onBtExport()" class="primary">Export to Excel</button>
        </div>
    </div>
    <div class="grid-wrapper">
        <div id="myGrid"></div>
    </div>
</div>
