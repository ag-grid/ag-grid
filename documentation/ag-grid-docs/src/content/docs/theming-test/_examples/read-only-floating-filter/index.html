<div class="example-wrapper">
    <div class="example-header example-controls">
        <div class="controls-row">
            <button onclick="useTheme('quartz', 'light')">Quartz</button>
            <button onclick="useTheme('quartz', 'dark')">Quartz Dark</button>
            <button onclick="useTheme('quartz', 'dark-blue')">Quartz Dark Blue</button>
            <button onclick="useTheme('alpine', 'light')">Alpine</button>
            <button onclick="useTheme('alpine', 'dark')">Alpine Dark</button>
            <button onclick="useTheme('balham', 'light')">Balham</button>
            <button onclick="useTheme('balham', 'dark')">Balham Dark</button>
            <button onclick="useTheme('material', 'light')">Material</button>
            <button onclick="useTheme('material', 'dark')">Material Dark</button>
        </div>
        <div class="controls-row">
            <span>Click on a read-only input:</span>
            <button onclick="setClickAction('selectText')">Select text</button>
            <button onclick="setClickAction('openPopup')">Open popup</button>
        </div>
    </div>
    <div id="myGrid"></div>
</div>
