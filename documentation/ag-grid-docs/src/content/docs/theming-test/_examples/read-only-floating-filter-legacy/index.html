<div class="example-wrapper">
    <div class="example-header example-controls">
        <div class="controls-row">
            <button onclick="useTheme('quartz', false)">Quartz</button>
            <button onclick="useTheme('quartz', true)">Quartz Dark</button>
            <button onclick="useTheme('alpine', false)">Alpine</button>
            <button onclick="useTheme('alpine', true)">Alpine Dark</button>
            <button onclick="useTheme('balham', false)">Balham</button>
            <button onclick="useTheme('balham', true)">Balham Dark</button>
            <button onclick="useTheme('material', false)">Material</button>
            <button onclick="useTheme('material', true)">Material Dark</button>
        </div>
        <div class="controls-row">
            <span>Click on a read-only input:</span>
            <button onclick="setClickAction('selectText')">Select text</button>
            <button onclick="setClickAction('openPopup')">Open popup</button>
        </div>
    </div>
    <div id="myGrid" class="ag-theme-quartz"></div>
</div>
