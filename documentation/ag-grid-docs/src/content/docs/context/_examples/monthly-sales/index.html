<div class="example-wrapper">
    <div class="example-controls">
        <div class="controls-row">
            <input
                type="text"
                id="filter-text-box"
                style="width: 100px"
                oninput="onQuickFilterChanged()"
                placeholder="Filter..."
            />

            <span class="gap-left">Period:</span>
            <button onclick="onChangeMonth(-1)"><i class="fa fa-chevron-left"></i></button>
            <button onclick="onChangeMonth(1)"><i class="fa fa-chevron-right"></i></button>
            <span id="monthName" style="width: 100px; display: inline-block">Year to Jan</span>

            <span class="legend-item gap-left">
                <span class="legend-swatch cell-bud"></span>
                Actual
            </span>
            <span class="legend-item">
                <span class="legend-swatch cell-act"></span>
                Budget
            </span>
        </div>
    </div>
    <div style="height: 100%" id="myGrid"></div>
</div>
