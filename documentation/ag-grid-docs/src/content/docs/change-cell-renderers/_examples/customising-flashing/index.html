<div style="height: 100%; display: flex; flex-direction: column">
    <div style="margin-bottom: 4px; display: flex; gap: 8px; align-items: center">
        <button onclick="onUpdateSomeValues()">Update Some Data</button>
        <label>
            Flash colour:
            <input
                type="text"
                id="flash-colour"
                value="#cc222244"
                oninput="onFlashColourChanged(event.target.value)"
                style="width: 100px"
            />
        </label>
    </div>
    <div style="flex-grow: 1">
        <div id="myGrid" style="height: 100%"></div>
    </div>
</div>
