<div class="example-wrapper">
    <div class="example-header example-controls">
        <div class="controls-row">
            <label for="find-text-box">Find:</label>
            <input type="text" id="find-text-box" />
            <button onclick="previous()">Previous</button>
            <button onclick="next()">Next</button>
            <span id="activeMatchNum"></span>
            <label for="find-goto" class="gap-left">Go to match:</label>
            <input type="number" id="find-goto" min="1" />
            <button onclick="goToFind()">Go To</button>
        </div>
    </div>
    <div id="myGrid"></div>
</div>
