<div class="example-wrapper">
    <div class="example-controls">
        <div class="controls-row">
            <div class="button-group" role="group" aria-label="Drag behaviour">
                <input type="radio" id="move" name="radio" checked />
                <label for="move">Remove Source Rows</label>
                <input type="radio" id="deselect" name="radio" />
                <label for="deselect">Only Deselect Source Rows</label>
                <input type="radio" id="none" name="radio" />
                <label for="none">None</label>
            </div>
            <button type="button" class="reset"><i class="fas fa-redo" style="margin-right: 5px"></i>Reset</button>
        </div>
    </div>
    <div class="grid-wrapper">
        <div class="panel panel-primary" style="margin-right: 10px">
            <div class="panel-heading">Athletes</div>
            <div class="panel-body">
                <div id="eLeftGrid"></div>
            </div>
        </div>
        <div class="panel panel-primary" style="margin-left: 10px">
            <div class="panel-heading">Selected Athletes</div>
            <div class="panel-body">
                <div id="eRightGrid"></div>
            </div>
        </div>
    </div>
</div>
