nodeLinker: node-modules

# Only internal org members can open PRs here (no external forks), so hardened mode's threat model doesn't apply, and it's incompatible with how this repo uses `resolutions`.
enableHardenedMode: false

# Yarn 4.10.3 (fixed in 4.18.1) has a rare internal crash under load: "The `onCancel` handler was
# attached after the promise settled" (yarnpkg/berry#7245/#7249), triggered when a network request's
# retry event fires after its own promise already settled - more likely at the default 50-way
# concurrency. Lowering it shrinks that race window without disabling retries outright (which would
# trade this rare crash for more frequent failures on genuine transient network blips).
networkConcurrency: 16
