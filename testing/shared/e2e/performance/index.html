<!doctype html>
<html lang="en">
    <head>
        <title>JavaScript Example - Grouping Single Group Column - Enabling Single Group Column</title>
        <meta charset="UTF-8" />
    </head>
    <body>
        <div id="myGrid" style="height: 100vh"></div>
        <script>
            function run() {
                let gridApi;

                const gridOptions = {
                    columnDefs: [{ field: 'athlete' }, { field: 'sport' }, { field: 'total' }],
                    onDisplayedRowsChanged: console.log,
                };

                const gridDiv = document.querySelector('#myGrid');
                gridApi = agGrid.createGrid(gridDiv, gridOptions);

                fetch('https://www.ag-grid.com/example-assets/olympic-winners.json')
                    .then((response) => response.json())
                    .then((data) => gridApi.setGridOption('rowData', data));
            }
        </script>
    </body>
</html>
