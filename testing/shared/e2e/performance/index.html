<!doctype html>
<html lang="en">
    <head>
        <title>JavaScript Example - Grouping Single Group Column - Enabling Single Group Column</title>
        <meta charset="UTF-8" />
    </head>
    <body>
        <div id="myGrid" style="height: 100%"></div>
        <script>
            let gridApi;

            const gridOptions = {
                columnDefs: [{ field: 'athlete' }, { field: 'sport' }, { field: 'total' }],
                onDisplayedRowsChanged: console.log,
            };

            const onRefreshRows = () => {
                gridApi.refreshCells({ rowNodes: [] });
            };

            const updateRowData = () => {
                gridApi.forEachNode((node) => {
                    node.setDataValue('total', 2);
                });
            };

            // setup the grid after the page has finished loading
            document.addEventListener('DOMContentLoaded', function () {
                const gridDiv = document.querySelector('#myGrid');
                gridApi = agGrid.createGrid(gridDiv, gridOptions);

                fetch('https://www.ag-grid.com/example-assets/olympic-winners.json')
                    .then((response) => response.json())
                    .then((data) => gridApi.setGridOption('rowData', data));
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/ag-grid-enterprise@33.1.1/dist/ag-grid-enterprise.min.js?t=1741259898872"></script>
        <script src="main.js"></script>
    </body>
</html>
