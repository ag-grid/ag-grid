name: Module Size Test
description: Build and run module size tests for a given git ref

inputs:
  ref:
    description: 'Git ref to get source code from (branch, tag, or SHA)'
    required: true
  shard:
    description: 'Current shard number'
    required: true
  total-shards:
    description: 'Total number of shards'
    required: true
  artifact-prefix:
    description: 'Prefix for the uploaded artifact name'
    required: true
  artifact-suffix:
    description: 'Optional suffix for artifact name (e.g., PR number)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Always checkout latest for tooling (actions, scripts, nx config, etc.)
    - name: Checkout latest for tooling
      uses: actions/checkout@v4
      with:
        ref: latest
        fetch-depth: 1

    # If ref is not latest, overlay the source packages from the target ref
    - name: Checkout source packages from target ref
      if: inputs.ref != 'latest'
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        sparse-checkout: |
          packages/ag-grid-community
          packages/ag-grid-enterprise
          packages/ag-grid-react
        path: .source-overlay

    - name: Overlay source packages
      if: inputs.ref != 'latest'
      shell: bash
      run: |
        rm -rf packages/ag-grid-community packages/ag-grid-enterprise packages/ag-grid-react
        mv .source-overlay/packages/ag-grid-community packages/
        mv .source-overlay/packages/ag-grid-enterprise packages/
        mv .source-overlay/packages/ag-grid-react packages/
        rm -rf .source-overlay

    - name: Setup
      uses: ./.github/actions/setup-nx
      with:
        cache_mode: ro
        base_ref: latest

    - name: Build dependencies
      shell: bash
      run: |
        yarn nx run-many -t build --projects=ag-grid-community,ag-grid-enterprise,ag-grid-react

    - name: Run module size tests
      shell: bash
      working-directory: testing/module-size
      run: |
        npm run module-combinations -- --shard=${{ inputs.shard }}/${{ inputs.total-shards }}
        mv module-size-results.json module-size-results-shard-${{ inputs.shard }}.json

    - name: Upload shard results
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-prefix }}-shard-${{ inputs.shard }}${{ inputs.artifact-suffix && format('-{0}', inputs.artifact-suffix) || '' }}
        path: testing/module-size/module-size-results-shard-${{ inputs.shard }}.json
        retention-days: 1
