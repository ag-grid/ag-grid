name: Module Size Build
description: >
  Build the ag-grid packages for a given git ref once and upload their dist
  folders as an artifact, so the (sharded) module-size measure jobs can consume
  a single build instead of each rebuilding the packages themselves.

inputs:
  ref:
    description: 'Git ref to checkout (branch, tag, or SHA)'
    required: true
  dist-artifact:
    description: 'Name of the artifact to upload the built dist folders under'
    required: true
  base-ref:
    description: 'Base ref for nx setup (defaults to input ref)'
    required: false
  actions-ref:
    description: 'Git ref to get .github/actions from (for building older refs that lack these actions)'
    required: false
    default: ''
  cache-mode:
    description: 'Cache mode for setup-nx (rw, ro, off). Use off for release tags to avoid cross-version cache hits.'
    required: false
    default: 'ro'

runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 1

    - name: Checkout actions from actions-ref
      if: inputs.actions-ref != '' && inputs.actions-ref != inputs.ref
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.actions-ref }}
        sparse-checkout: |
          .github/actions
          external/ag-shared/github/actions
        path: .actions-temp

    - name: Copy actions from actions-ref
      if: inputs.actions-ref != '' && inputs.actions-ref != inputs.ref
      shell: bash
      run: |
        rm -rf .github/actions
        cp -r .actions-temp/.github/actions .github/actions
        # setup-nx wraps the shared core under external/ag-shared/github/actions; the
        # base/release source can predate it, so bring it from the actions-ref too.
        rm -rf external/ag-shared/github/actions
        mkdir -p external/ag-shared/github
        cp -r .actions-temp/external/ag-shared/github/actions external/ag-shared/github/actions
        rm -rf .actions-temp

    - name: Setup
      uses: ./.github/actions/setup-nx
      with:
        cache_mode: ${{ inputs.cache-mode }}
        base_ref: ${{ inputs.base-ref || inputs.ref }}

    - name: yarn install (no cache)
      if: inputs.cache-mode == 'off'
      shell: bash
      run: yarn install --ci

    - name: Build packages
      shell: bash
      run: |
        yarn nx run-many -t build --projects=ag-grid-community,ag-grid-enterprise,ag-grid-react

    - name: Upload built dist
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.dist-artifact }}
        # The module-size harness resolves ag-grid-community/enterprise/react through the
        # workspace symlinks in node_modules into packages/*/dist, so those three dist
        # folders are all the measure shards need. setup-nx recreates the symlinks there.
        path: |
          packages/ag-grid-community/dist
          packages/ag-grid-enterprise/dist
          packages/ag-grid-react/dist
        retention-days: 1
        include-hidden-files: true
