name: Doc Tests 
description: Testing of AG Grid Examples

env:
    NX_NO_CLOUD: true
    CI: true
    DEFAULT_RETENTION_DAYS: 30

on:
    push:
        branches: ['AG-15304-doc-tests']
    pull_request:
        branches: ['AG-15304-doc-tests']
    workflow_dispatch:
        inputs:
            clean_checkout:
                description: 'Disable all caching'
                type: 'choice'
                required: true
                default: 'false'
                options:
                    - 'true'
                    - 'false'
    schedule:
        - cron: '30 2 * * *' # Run daily at 1:30am UTC

jobs:
    docs-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 1

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                cache_mode: ${{ github.event.inputs.clean_checkout == 'true' && 'off' || 'rw' }}

            - name: Upload workspace
              uses: actions/upload-artifact@v4
              with:
                name: ag-grid-workspace
                path: |
                  . # or a more specific path if you want

    # Run all framework tasks in parallel
    test-demos:
        needs: docs-test
        runs-on: ubuntu-latest
        steps:
            - name: Download workspace
              uses: actions/download-artifact@v4
              with:
                name: ag-grid-workspace
                path: .

            - name: Demo Pages
              run: yarn nx run ag-grid-docs-testing:test:e2e:demos

    test-react-functional:
        needs: docs-test
        runs-on: ubuntu-latest
        steps:
             - name: Download workspace
              uses: actions/download-artifact@v4
              with:
                name: ag-grid-workspace
                path: .

             - name: React Functional
              run: yarn nx run ag-grid-docs-testing:test:e2e:reactFunctional

    test-react-functional-ts:
        needs: docs-test
        runs-on: ubuntu-latest
        steps:
            - name: Download workspace
              uses: actions/download-artifact@v4
              with:
                name: ag-grid-workspace
                path: .

            - name: React Functional TS
              run: yarn nx run ag-grid-docs-testing:test:e2e:reactFunctionalTs

    test-typescript:
        needs: docs-test
        runs-on: ubuntu-latest
        steps:
            - name: Download workspace
              uses: actions/download-artifact@v4
              with:
                name: ag-grid-workspace
                path: .

            - name: Typescript
              run: yarn nx run ag-grid-docs-testing:test:e2e:typescript

    test-vanilla:
        needs: docs-test
        runs-on: ubuntu-latest
        steps:
            - name: Download workspace
              uses: actions/download-artifact@v4
              with:
                name: ag-grid-workspace
                path: .

            - name: Vanilla
              run: yarn nx run ag-grid-docs-testing:test:e2e:vanilla

    test-vue3:
        needs: docs-test
        runs-on: ubuntu-latest
        steps:
            - name: Download workspace
              uses: actions/download-artifact@v4
              with:
                name: ag-grid-workspace
                path: .

            - name: Vue3
              run: yarn nx run ag-grid-docs-testing:test:e2e:vue3
