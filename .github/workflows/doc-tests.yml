name: Doc Tests 
description: Testing of AG Grid Examples

env:
    NX_NO_CLOUD: true
    CI: true
    DEFAULT_RETENTION_DAYS: 30

on:
    push:
        branches: ['AG-15304-doc-tests']
    pull_request:
        branches: ['AG-15304-doc-tests']
    workflow_dispatch:
        inputs:
            clean_checkout:
                description: 'Disable all caching'
                type: 'choice'
                required: true
                default: 'false'
                options:
                    - 'true'
                    - 'false'
    schedule:
        - cron: '30 2 * * *' # Run daily at 2:30am UTC

jobs:
    # Run all framework tasks in parallel
    test-demos:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 1

            - name: Install Playwright Browsers
              working-directory: testing/ag-grid-docs
              run: npm install && npx playwright install --with-deps chromium firefox webkit

            - name: Demo Pages
              working-directory: testing/ag-grid-docs
              run: npx playwright test ag-grid-demos.spec.ts

            - name: Upload Test Report
              id: upload-report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: playwright-report-demos
                path: reports/
                retention-days: ${{env.DEFAULT_RETENTION_DAYS}}

    download-examples:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 1

        - name: Download all-examples-cached.json
          run: |
            mkdir -p ./e2e/config
            curl https://grid-staging.ag-grid.com/debug/all-examples.json > ./testing/ag-grid-docs/e2e/config/all-examples-cached.json

        - name: Cache all-examples-cached.json
          uses: actions/cache@v4
          with:
            path: ./testing/ag-grid-docs/e2e/config/all-examples-cached.json
            key: all-examples-${{ hashFiles('./testing/ag-grid-docs/e2e/config/all-examples-cached.json') }}

    test-react-functional:
        needs: download-examples
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 1

            - name: Restore all-examples-cached.json
              uses: actions/cache@v4
              with:
                path: ./testing/ag-grid-docs/e2e/config/all-examples-cached.json
                key: all-examples-${{ hashFiles('./testing/ag-grid-docs/e2e/config/all-examples-cached.json') }}

            - name: Install Playwright Browsers
              working-directory: testing/ag-grid-docs
              run: npm install && npx playwright install --with-deps chromium firefox webkit

            - name: React Functional
              working-directory: testing/ag-grid-docs
              run: FRAMEWORK=reactFunctional npx playwright test framework-examples.spec.ts

            - name: Upload Test Report
              id: upload-report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: playwright-report-react-functional
                path: reports/
                retention-days: ${{env.DEFAULT_RETENTION_DAYS}}

    test-react-functional-ts:
        needs: download-examples
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 1

            - name: Restore all-examples-cached.json
              uses: actions/cache@v4
              with:
                path: ./testing/ag-grid-docs/e2e/config/all-examples-cached.json
                key: all-examples-${{ hashFiles('./testing/ag-grid-docs/e2e/config/all-examples-cached.json') }}                

            - name: Install Playwright Browsers
              working-directory: testing/ag-grid-docs
              run: npm install && npx playwright install --with-deps chromium firefox webkit

            - name: React Functional TS
              working-directory: testing/ag-grid-docs
              run: FRAMEWORK=reactFunctionalTs npx playwright test framework-examples.spec.ts

            - name: Upload Test Report
              id: upload-report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: playwright-report-react-functional-ts
                path: reports/
                retention-days: ${{env.DEFAULT_RETENTION_DAYS}}

    test-angular:
        needs: download-examples
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            shardIndex: [1, 2, 3, 4]
            shardTotal: [4]
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 1

            - name: Restore all-examples-cached.json
              uses: actions/cache@v4
              with:
                path: ./testing/ag-grid-docs/e2e/config/all-examples-cached.json
                key: all-examples-${{ hashFiles('./testing/ag-grid-docs/e2e/config/all-examples-cached.json') }}

            - name: Install Playwright Browsers
              working-directory: testing/ag-grid-docs
              run: npm install && npx playwright install --with-deps chromium firefox webkit

            - name: Angular
              working-directory: testing/ag-grid-docs
              run: FRAMEWORK=angular npx playwright test framework-examples.spec.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

            - name: Upload Test Report
              id: upload-report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: playwright-report-angular-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}
                path: reports/
                retention-days: ${{env.DEFAULT_RETENTION_DAYS}}

    test-typescript:
        needs: download-examples
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 1

            - name: Restore all-examples-cached.json
              uses: actions/cache@v4
              with:
                path: ./testing/ag-grid-docs/e2e/config/all-examples-cached.json
                key: all-examples-${{ hashFiles('./testing/ag-grid-docs/e2e/config/all-examples-cached.json') }}

            - name: Install Playwright Browsers
              working-directory: testing/ag-grid-docs
              run: npm install && npx playwright install --with-deps chromium firefox webkit

            - name: Typescript
              working-directory: testing/ag-grid-docs
              run: FRAMEWORK=typescript npx playwright test framework-examples.spec.ts

            - name: Upload Test Report
              id: upload-report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: playwright-report-typescript
                path: reports/
                retention-days: ${{env.DEFAULT_RETENTION_DAYS}}

    test-vanilla:
        needs: download-examples
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 1

            - name: Restore all-examples-cached.json
              uses: actions/cache@v4
              with:
                path: ./testing/ag-grid-docs/e2e/config/all-examples-cached.json
                key: all-examples-${{ hashFiles('./testing/ag-grid-docs/e2e/config/all-examples-cached.json') }}

            - name: Install Playwright Browsers
              working-directory: testing/ag-grid-docs
              run: npm install && npx playwright install --with-deps chromium firefox webkit

            - name: Vanilla
              working-directory: testing/ag-grid-docs
              run: FRAMEWORK=vanilla npx playwright test framework-examples.spec.ts

            - name: Upload Test Report
              id: upload-report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: playwright-report-vanilla
                path: reports/
                retention-days: ${{env.DEFAULT_RETENTION_DAYS}}

    test-vue3:
        needs: download-examples
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 1

            - name: Restore all-examples-cached.json
              uses: actions/cache@v4
              with:
                path: ./testing/ag-grid-docs/e2e/config/all-examples-cached.json
                key: all-examples-${{ hashFiles('./testing/ag-grid-docs/e2e/config/all-examples-cached.json') }}

            - name: Install Playwright Browsers
              working-directory: testing/ag-grid-docs
              run: npm install && npx playwright install --with-deps chromium firefox webkit

            - name: Vue3
              working-directory: testing/ag-grid-docs
              run: FRAMEWORK=vue3 npx playwright test framework-examples.spec.ts

            - name: Upload Test Report
              id: upload-report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: playwright-report-vue3
                path: reports/
                retention-days: ${{env.DEFAULT_RETENTION_DAYS}}
    publish-reports:
      if: always()
      needs:
        - test-demos
        - test-react-functional
        - test-react-functional-ts
        - test-angular
        - test-typescript
        - test-vanilla
        - test-vue3
      runs-on: ubuntu-latest
      steps:
        - name: Download all test reports
          uses: actions/download-artifact@v4
          with:
            path: combined-reports

        - name: Publish Combined Test Report
          uses: ctrf-io/github-test-reporter@v1
          with:
            report-path: 'combined-reports/**/*.json'
            summary-report: true
            failed-report: true
            flaky-report: true
            skipped-report: true