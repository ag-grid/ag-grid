name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Build-Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
         
      - name: Bootstrap
        run: |
          npm run bootstrap
        
      - name: nx format:check
        run: |
          yarn nx format:check --all

      - name: nx lint
        run: |
          yarn nx -t lint --parallel=3 --exclude all

      - name: nx pack:verify --prod
        run: |
          yarn nx pack:verify --prod
  
