name: GitHub issue AI triage

# ============================================================================
# GitHub-issue → AITGH triage pipeline (thin per-repo stub).
#
# A new issue labelled `triage` runs the /ag-product:github-issues brain
# headlessly against a 1-1 AITGH mapping ticket; a human reviews on the AITGH
# board and drags Needs Review → In Progress to approve. The heavy lifting lives
# in the shared `github-triage-pipeline` composite action in @ag-grid/dev-prompts
# (pulled via the GitHub Packages tarball, exactly like jira-agent-pipeline.yml).
# This workflow owns triggers + eligibility gating only.
#
# Full design + operator reference:
#   ag-dev-prompts → docs/github-triage-pipeline.md
#
# Triggers:
#   issues (opened|labeled)            → triage    (the GitHub-native entry point)
#   repository_dispatch gh-triage-resume → preflight routes execute | resume
#       (from the single AITGH `→ In Progress` JIRA automation rule:
#        POST /repos/ag-grid/ag-grid/dispatches
#        {"event_type":"gh-triage-resume","client_payload":{"issue_key":"AITGH-XXX"}})
#   repository_dispatch gh-triage-manual-resume → ALWAYS stage=resume, no routing
#       (from a per-issue "Manual trigger" Jira Automation rule — a PM-facing
#        button in the AITGH issue view's "..." menu, unrelated to the
#        In Progress drag above. Explicit human intent, so it bypasses
#        preflight/decide-resume-route entirely rather than going through the
#        execute-vs-resume ambiguity that routing exists to resolve for the
#        drag. POST /repos/ag-grid/ag-grid/dispatches
#        {"event_type":"gh-triage-manual-resume","client_payload":{"issue_key":"AITGH-XXX"}})
#   repository_dispatch gh-triage-manual-browser-verify → ALWAYS stage=browser-verify
#       (same "Manual trigger" pattern, a third AITGH button, wired ahead of a
#        Jira button actually existing for it — see the workflow's own PR.
#        POST /repos/ag-grid/ag-grid/dispatches
#        {"event_type":"gh-triage-manual-browser-verify","client_payload":{"issue_key":"AITGH-XXX"}})
#   repository_dispatch gh-triage-manual-repro-rebuild → ALWAYS stage=repro-rebuild
#       (same "Manual trigger" pattern, a fourth AITGH button. Independent of
#        the browser-verify-chain/repro-rebuild-chain auto-chain below — this
#        is the human-confirmed-reproduces path from github-triage-pipeline's
#        rules.md, letting repro-rebuild run without ever needing browser-verify.
#        POST /repos/ag-grid/ag-grid/dispatches
#        {"event_type":"gh-triage-manual-repro-rebuild","client_payload":{"issue_key":"AITGH-XXX"}})
#   workflow_dispatch                  → force a stage (dry-run / debugging)
# ============================================================================

on:
    # Auto-triage of new `triage`-labelled issues — LIVE (this is the go-live switch;
    # it was commented out for the manual dogfood phase).
    #
    # `labeled` is needed as well as `opened` because the `triage` label is
    # very often added a moment after the issue is filed, not at creation.
    #
    # ⚠️ The `labeled` half fires on ANY label being added, so the `run` job's gate
    # additionally requires the ADDED label to be `triage` specifically. Without
    # that, stamping any other label (`AG-NNNNN`, `waiting-for-repro`, `invalid`)
    # on one of the ~64 pre-existing open `triage` issues would fire a full triage
    # on it — bypassing the batch-selection rule, and re-triaging an issue that may
    # already carry a reviewed verdict (which the pipeline would overwrite).
    issues:
        types: [opened, labeled]
    repository_dispatch:
        types: [gh-triage-resume, gh-triage-manual-resume, gh-triage-manual-browser-verify, gh-triage-manual-repro-rebuild]
    workflow_dispatch:
        inputs:
            stage:
                description: 'Pipeline stage'
                type: choice
                default: triage
                options: [triage, resume, browser-verify, repro-rebuild, execute, open-investigation]
            gh_issue:
                description: 'GitHub issue number (triage)'
                type: string
                required: false
            issue_key:
                description: 'AITGH key (resume/execute)'
                type: string
                required: false
            channel:
                description: '@ag-grid/dev-prompts dist-tag'
                type: choice
                default: latest
                options: [latest, canary]

permissions:
    contents: read
    issues: write # execute posts the reply + closes + labels
    packages: read # install @ag-grid/dev-prompts from GitHub Packages

concurrency:
    # Keyed on the GH issue number → a stable per-issue lock (no identity flip
    # between first-triage and the resume/execute drag).
    group: gh-triage-${{ github.event.issue.number || github.event.client_payload.gh_issue || inputs.gh_issue || github.event.client_payload.issue_key || inputs.issue_key }}
    cancel-in-progress: false

env:
    # Defaults to `latest`; a workflow_dispatch overrides via inputs.channel.
    #
    # For a repository_dispatch (the JIRA drag + the manual buttons) treat this as a
    # FALLBACK only — the effective value comes from the `resolve-channel` job below,
    # which reads the mapping ticket's own `channel-canary` pin so a ticket triaged on
    # canary keeps resuming/executing on canary while production traffic runs latest.
    # A workflow-level `env:` cannot reference a job output, which is why the jobs
    # below read `needs.resolve-channel.outputs.channel` and fall back to this.
    DEV_PROMPTS_CHANNEL: ${{ github.event.client_payload.channel || inputs.channel || 'latest' }}

jobs:
    # -------------------------------------------------- resolve-channel
    # Which @ag-grid/dev-prompts dist-tag should this dispatch run?
    #
    # The drag's payload comes from ONE Jira Automation rule, so it cannot carry a
    # per-ticket channel — which meant production and canary dry-run traffic could
    # not coexist on the board. Instead the pipeline stamps the channel it ran from
    # onto the mapping ticket as a `channel-canary` label, and this job reads it back.
    # Present ⇒ canary, absent ⇒ latest. See the github-triage-pipeline action's
    # `core/channel-label.ts`.
    #
    # The guarantee is release-channel continuity, NOT build immutability: dist-tags
    # move (canary on every publish, latest nightly), so a later drag runs newer code
    # from the SAME channel. That is deliberate — a version pin would freeze a ticket
    # triaged before a fix onto the broken code.
    #
    # Deliberately a raw REST GET rather than the pipeline bundle: this has to decide
    # WHICH channel to install, so it cannot itself depend on an installed package.
    # `labels` is a system field, so no field-id resolution is needed.
    #
    # MIGRATION: while the Jira rule still sends "channel":"canary" that payload wins,
    # so behaviour is unchanged and the pin is inert. Removing the `channel` field from
    # the rule body is the switch that hands control to the pin.
    resolve-channel:
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.issue_key != ''
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        outputs:
            channel: ${{ steps.r.outputs.channel }}
        steps:
            - id: r
              shell: bash
              env:
                  # Via env, never string-interpolated into the script body.
                  ISSUE_KEY: ${{ github.event.client_payload.issue_key }}
                  PAYLOAD_CHANNEL: ${{ github.event.client_payload.channel }}
                  JIRA_EMAIL: ${{ secrets.JIRA_AI_BOT_EMAIL }}
                  JIRA_API_TOKEN: ${{ secrets.JIRA_AI_BOT_API_TOKEN }}
                  JIRA_SITE_URL: ${{ vars.JIRA_SITE_URL }}
              run: |
                  set -uo pipefail

                  emit() { echo "channel=$1" >> "$GITHUB_OUTPUT"; echo "resolved channel: $1 ($2)"; }

                  # An explicit payload channel is an intentional override and wins.
                  if [ -n "${PAYLOAD_CHANNEL:-}" ]; then
                      emit "$PAYLOAD_CHANNEL" "explicit client_payload.channel"
                      exit 0
                  fi

                  if ! labels=$(curl -sS --fail --max-time 20 \
                        -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                        -H 'Accept: application/json' \
                        "$JIRA_SITE_URL/rest/api/3/issue/$ISSUE_KEY?fields=labels" \
                        | jq -r '.fields.labels[]? // empty'); then
                      # FAIL-SAFE to production. An unreadable ticket must not silently
                      # route a production drag to canary; a dry run losing its pin is
                      # the cheaper, visible failure.
                      echo "::warning title=channel-pin::could not read labels for $ISSUE_KEY — falling back to latest"
                      emit latest "label read failed"
                      exit 0
                  fi

                  if printf '%s\n' "$labels" | grep -qx 'channel-canary'; then
                      emit canary "channel-canary pin present"
                  else
                      emit latest "no pin"
                  fi

    # -------------------------------------------------- preflight
    # Only on the JIRA `→ In Progress` drag. Mechanical (no agent): reads the
    # AITGH ticket's SUGGESTED-ACTION-READY marker + comments + bot-actor and
    # emits `stage` (execute | resume | '' for suppress).
    preflight:
        needs: [resolve-channel]
        # `!cancelled()` because resolve-channel is SKIPPED for every non-dispatch
        # event, and a skipped dependency would otherwise skip this job regardless of
        # the condition below (which is already false in exactly those cases).
        if: |
            !cancelled() &&
            github.event_name == 'repository_dispatch' && github.event.action == 'gh-triage-resume'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            packages: read
        outputs:
            stage: ${{ steps.pf.outputs.stage }}
            issue_key: ${{ steps.pf.outputs.issue_key }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1
            - name: Install @ag-grid/dev-prompts
              uses: ./external/ag-shared/github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ needs.resolve-channel.outputs.channel || env.DEV_PROMPTS_CHANNEL }}
            - id: pf
              uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/github-triage-resume-preflight
              with:
                  issue_key: ${{ github.event.client_payload.issue_key }}
                  jira_email: ${{ secrets.JIRA_AI_BOT_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_AI_BOT_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}
                  jira_ai_bot_account_id: ${{ vars.JIRA_AI_BOT_ACCOUNT_ID }}

    # -------------------------------------------------- run
    # The parameterised stage runner (triage / resume / execute / browser-verify /
    # repro-rebuild). Runs on the issue event (triage), a forced dispatch, a
    # non-empty preflight route, or one of the three manual-trigger button
    # events (which — unlike gh-triage-resume — always resolve to ONE specific
    # stage directly, no preflight/routing involved: the PM's button click IS
    # the unambiguous intent signal).
    run:
        needs: [preflight, resolve-channel]
        if: |
            !cancelled() &&
            (
              (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'triage') && github.event.issue.state == 'open' && (github.event.action == 'opened' || github.event.label.name == 'triage'))
              || github.event_name == 'workflow_dispatch'
              || (github.event_name == 'repository_dispatch' && needs.preflight.outputs.stage != '')
              || (github.event_name == 'repository_dispatch' && github.event.action == 'gh-triage-manual-resume')
              || (github.event_name == 'repository_dispatch' && github.event.action == 'gh-triage-manual-browser-verify')
              || (github.event_name == 'repository_dispatch' && github.event.action == 'gh-triage-manual-repro-rebuild')
            ) &&
            needs.preflight.outputs.stage != 'execute' && inputs.stage != 'execute'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # `issues: read`, NOT write — see the `execute` job below. Every GitHub
            # WRITE in the pipeline lives in execute.ts; every other label call in the
            # codebase is `jira.addLabel`, not `gh`. So the agent stages (triage /
            # resume / the browser chain) never needed write, and holding it meant an
            # agent reading attacker-authored issue text sat in a job that could write
            # to GitHub. Same argument as #14834: an unused permission is not hardening
            # work, it is a mistake.
            issues: read
            packages: read
        outputs:
            # NEW — downstream chain jobs need the mapping-ticket key and the
            # fresh-confirmed-bug signal. See github-triage-pipeline action's own
            # CLAUDE.md § "Auto-chaining browser-verify / repro-rebuild".
            issue_key: ${{ steps.pipeline.outputs.issue_key }}
            confirmed_bug: ${{ steps.pipeline.outputs.confirmed_bug }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1
            - name: Install @ag-grid/dev-prompts
              uses: ./external/ag-shared/github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ needs.resolve-channel.outputs.channel || env.DEV_PROMPTS_CHANNEL }}
            - id: pipeline
              uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/github-triage-pipeline
              with:
                  # Manual-dispatch action checks come FIRST, unconditionally,
                  # BEFORE needs.preflight.outputs.stage (Codex — a real P1: the
                  # previous order let a same-priority `||` chain trust
                  # preflight's output ahead of the action-specific stage,
                  # relying on preflight's OWN `if:` (which only ever matches
                  # `gh-triage-resume`) to keep its output empty for these
                  # events, rather than that invariant being enforced at the
                  # POINT OF USE here too. Checking the manual action FIRST
                  # makes it structurally impossible for anything
                  # preflight-related to override or block a manual dispatch,
                  # regardless of preflight's own behaviour.
                  stage: ${{ (github.event.action == 'gh-triage-manual-resume' && 'resume') || (github.event.action == 'gh-triage-manual-browser-verify' && 'browser-verify') || (github.event.action == 'gh-triage-manual-repro-rebuild' && 'repro-rebuild') || needs.preflight.outputs.stage || inputs.stage || 'triage' }}
                  product: grid
                  # claude-code-action refuses to run when the TRIGGERING ACTOR lacks
                  # write access — and on an `issues` event that actor is the ISSUE
                  # AUTHOR, a community reporter with `read`. Auto-triage therefore
                  # failed for every genuine community report ("Actor does not have
                  # write permissions to the repository") and only ever worked when a
                  # maintainer happened to touch the issue, which is the opposite of
                  # the feature. It looked healthy because the first live ticket was
                  # label-triggered by a maintainer; the first real community report
                  # (AITGH-28 / #14837) failed on both auto-fires.
                  #
                  # Scoped to the `issues` event ALONE: the board drag, the manual
                  # buttons and workflow_dispatch all already carry a write-capable
                  # actor, so the gate stays armed there at no cost — and stays armed
                  # for any trigger added later. Setting this also makes
                  # claude-code-action best-effort scrub secrets from subprocess
                  # environments.
                  allowed_non_write_users: ${{ github.event_name == 'issues' && '*' || '' }}
                  # Provenance for the pin: `post` stamps this channel onto the
                  # mapping ticket so `resolve-channel` can route the NEXT drag to the
                  # same channel. Must match the channel actually installed above.
                  channel: ${{ needs.resolve-channel.outputs.channel || env.DEV_PROMPTS_CHANNEL }}
                  gh_issue: ${{ github.event.issue.number || github.event.client_payload.gh_issue || inputs.gh_issue }}
                  issue_key: ${{ needs.preflight.outputs.issue_key || github.event.client_payload.issue_key || inputs.issue_key }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  jira_email: ${{ secrets.JIRA_AI_BOT_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_AI_BOT_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}
                  jira_ai_bot_account_id: ${{ vars.JIRA_AI_BOT_ACCOUNT_ID }}

    # -------------------------------------------------- execute
    # The ONLY job that may write to GitHub, and the only one that needs to.
    #
    # `execute` is MECHANICAL — no agent, no Anthropic key, no browser: it performs the
    # approved action in deterministic TypeScript (mint the golden AG ticket, post the
    # reply, apply the label, close the issue). It is split out of `run` purely so that
    # `issues: write` stops being handed to jobs that run an AGENT over untrusted,
    # reporter-authored text. Splitting the small mechanical job out is far cheaper than
    # splitting the large agent job out, and leaves the chain jobs' `needs: [run]`
    # wiring untouched.
    #
    # Reachable only via the two paths that can resolve stage=execute: the board drag
    # routed here by preflight, and an explicit `workflow_dispatch stage=execute`.
    execute:
        needs: [preflight, resolve-channel]
        if: |
            !cancelled() &&
            (
              (github.event_name == 'repository_dispatch' && needs.preflight.outputs.stage == 'execute')
              || (github.event_name == 'workflow_dispatch' && inputs.stage == 'execute')
            )
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write # mint → reply → label → close, all mechanical
            packages: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1
            - name: Install @ag-grid/dev-prompts
              uses: ./external/ag-shared/github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ needs.resolve-channel.outputs.channel || env.DEV_PROMPTS_CHANNEL }}
            - uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/github-triage-pipeline
              with:
                  stage: execute
                  product: grid
                  channel: ${{ needs.resolve-channel.outputs.channel || env.DEV_PROMPTS_CHANNEL }}
                  gh_issue: ${{ github.event.client_payload.gh_issue || inputs.gh_issue }}
                  issue_key: ${{ needs.preflight.outputs.issue_key || github.event.client_payload.issue_key || inputs.issue_key }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  jira_email: ${{ secrets.JIRA_AI_BOT_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_AI_BOT_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}
                  jira_ai_bot_account_id: ${{ vars.JIRA_AI_BOT_ACCOUNT_ID }}

    # -------------------------------------------------- browser-verify-chain (NEW)
    # Auto-fires ONLY after a FRESH triage (issues event, or an explicit
    # workflow_dispatch stage=triage) just recorded a genuine triage-confirmed-bug
    # — never after a resume/execute run, and never on a stale/failed run (the
    # confirmed_bug output is itself gated on that — see the action's CLAUDE.md).
    # Deliberately NOT gated on a resume also confirming a bug for this first
    # increment — extending that is a small, separate follow-on if wanted.
    #
    # SECURITY NOTE: this reuses the SAME job permissions as `run` (no dedicated
    # minimal-permission job split / persist-credentials:false / harden-runner
    # block yet) — that hardening is a deliberately separate, not-yet-landed
    # follow-up (see github-triage-pipeline action's CLAUDE.md § "Browser-verify
    # (B2) — security posture"). Do not treat this job as hardened.
    browser-verify-chain:
        needs: [run]
        if: |
            !cancelled() &&
            needs.run.outputs.confirmed_bug == 'true' &&
            (
              github.event_name == 'issues'
              || (github.event_name == 'workflow_dispatch' && inputs.stage == 'triage')
            )
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # NO `issues: write` — deliberately narrower than the `run` job.
            #
            # These two stages navigate UNTRUSTED, reporter-authored repro pages, and
            # they perform ZERO GitHub writes: every write they cause is the pipeline's
            # own Jira write, authenticated by JIRA_API_TOKEN. Inheriting `issues: write`
            # therefore handed an injectable agent a credential it never uses — and
            # "the agent has no write tool" does not mean the token is out of reach,
            # since it can read the environment and call the GitHub API directly.
            # Raised twice as a P0 on ag-dev-prompts#840; the full browser-stage
            # hardening stays deferred for the pilot, but an UNUSED permission is not
            # hardening work, it is a mistake. See ag-dev-prompts
            # docs/github-triage-deferred-hardening.md section 1.
            issues: read
            packages: read
        outputs:
            reproduces: ${{ steps.pipeline.outputs.reproduces }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1
            - name: Install @ag-grid/dev-prompts
              uses: ./external/ag-shared/github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}
            - id: pipeline
              uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/github-triage-pipeline
              with:
                  stage: browser-verify
                  product: grid
                  issue_key: ${{ needs.run.outputs.issue_key }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  jira_email: ${{ secrets.JIRA_AI_BOT_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_AI_BOT_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}
                  jira_ai_bot_account_id: ${{ vars.JIRA_AI_BOT_ACCOUNT_ID }}

    # -------------------------------------------------- repro-rebuild-chain (NEW)
    # Auto-fires ONLY after browser-verify-chain recorded a genuine, fresh
    # `reproduces` verdict. needs BOTH prior jobs (not just browser-verify-chain)
    # because its own step below reads needs.run.outputs.issue_key — a job can
    # only reference needs.<job>.outputs for jobs actually listed in its own
    # `needs:`. Same security note as browser-verify-chain above.
    repro-rebuild-chain:
        needs: [run, browser-verify-chain]
        if: |
            !cancelled() && needs.browser-verify-chain.outputs.reproduces == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # NO `issues: write` — deliberately narrower than the `run` job.
            #
            # These two stages navigate UNTRUSTED, reporter-authored repro pages, and
            # they perform ZERO GitHub writes: every write they cause is the pipeline's
            # own Jira write, authenticated by JIRA_API_TOKEN. Inheriting `issues: write`
            # therefore handed an injectable agent a credential it never uses — and
            # "the agent has no write tool" does not mean the token is out of reach,
            # since it can read the environment and call the GitHub API directly.
            # Raised twice as a P0 on ag-dev-prompts#840; the full browser-stage
            # hardening stays deferred for the pilot, but an UNUSED permission is not
            # hardening work, it is a mistake. See ag-dev-prompts
            # docs/github-triage-deferred-hardening.md section 1.
            issues: read
            packages: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1
            - name: Install @ag-grid/dev-prompts
              uses: ./external/ag-shared/github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}
            - uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/github-triage-pipeline
              with:
                  stage: repro-rebuild
                  product: grid
                  issue_key: ${{ needs.run.outputs.issue_key }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  jira_email: ${{ secrets.JIRA_AI_BOT_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_AI_BOT_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}
                  jira_ai_bot_account_id: ${{ vars.JIRA_AI_BOT_ACCOUNT_ID }}
