name: Publish Package

on:
  push:
    workflow_dispatch:
    tags:
      - 'release-*'

env:
  CI: true
  DEPLOYMENT_APP_ID: 957224
  TAG_NAME: ${{ github.head_ref || github.ref_name }}

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate with GitHub App
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ env.DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch Refs
        run: |
          git fetch origin --depth 1 ${{ github.ref_name }}

      - name: Set Env
        run: |
          echo "RELEASE_VERSION=$(echo $TAG_NAME | sed 's/release-//')" >> $GITHUB_ENV

