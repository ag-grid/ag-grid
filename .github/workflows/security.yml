name: Security

env:
  SECURITY_IGNORE_LIST: "documentation/ag-grid-docs/scripts/markdoc-migration/package.json,packages/ag-grid-angular/projects/ag-grid-angular/package.json,packages/ag-grid-enterprise/package.json,packages/ag-grid-vue3/package.json,plugins/ag-grid-generate-code-reference-files/package.json,plugins/ag-grid-generate-example-files/package.json,testing/module-size/package.json,testing/module-size-angular/package.json"

on:
    issue_comment:
        types: [created]
    workflow_dispatch:
    schedule:
      - cron: '0 0 * * *' # Run daily at midnight UTC
    push:
      branches: ["AG-3390-snyk-gha"]
    pull_request:
      branches: ["AG-3390-snyk-gha"]

jobs:
  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.comment.body == '/security') || github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@main
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --exclude=project.json --severity-threshold=high --exclude=${{ vars.SECURITY_IGNORE_LIST }}

  code-security:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.comment.body == '/security') || github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@main
      - name: Run Snyk SAST security code scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high
