name: Module Size Comparison

on:
  pull_request:
    branches:
      - 'latest'
      - 'b[0-9][0-9]?.[0-9][0-9]?.[0-9][0-9]?'
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          PR number to compare (for manual runs). Must be an open PR from this repo whose head branch is
          the one you dispatch on; otherwise the run warns and skips every job. A draft PR is fine.
        type: number
        required: true

env:
  # Disable git's post-fetch background gc/maintenance for every git invocation in this
  # workflow (via git's GIT_CONFIG_* protocol); otherwise it rewrites .git/shallow
  # concurrently with the next chained `git fetch --depth 1`, intermittently failing job
  # setup with "fatal: shallow file has changed since we read it". Fixed in git >= 2.55.
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: gc.auto
  GIT_CONFIG_VALUE_0: '0'
  GIT_CONFIG_KEY_1: maintenance.auto
  GIT_CONFIG_VALUE_1: 'false'
  NX_NO_CLOUD: true
  NX_BRANCH: ${{ github.ref }}
  SHARP_IGNORE_GLOBAL_LIBVIPS: true
  YARN_NPM_REGISTRY_SERVER: "https://registry.ag-grid.com"
  CI: true
  SHARD_COUNT: 3

concurrency:
  group: module-size-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  prepare:
    name: Prepare Context
    runs-on: ubuntu-latest
    # pull-requests: read is for the dispatch lookup in pr-context.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      # `false` skips every job below: a draft pull_request, or a manual run whose PR didn't resolve.
      run: ${{ steps.resolve.outputs.run }}
      base-ref: ${{ steps.resolve.outputs.base-ref }}
      shard-matrix: ${{ steps.resolve.outputs.shard-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            external/ag-shared/github/actions/pr-context

      # On a manual run: the PR named by `pr_number`, if it is open, from this repo and on this
      # branch. Anything else warns and sets `present` to false, so the run skips rather than
      # acting on a PR it wasn't dispatched for. Draft state is deliberately not checked.
      - name: Resolve PR context
        id: pr
        uses: ./external/ag-shared/github/actions/pr-context
        with:
          pr-number: ${{ github.event.inputs.pr_number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PR details
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SHARD_COUNT: ${{ env.SHARD_COUNT }}
          PR_PRESENT: ${{ steps.pr.outputs.present }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
        with:
          script: |
            const shardCount = parseInt(process.env.SHARD_COUNT, 10);
            const shards = Array.from({ length: shardCount }, (_, i) => i + 1);
            core.setOutput('shard-matrix', JSON.stringify(shards));

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              core.setOutput('pr-number', pr.number.toString());
              core.setOutput('head-sha', pr.head.sha);
              // Drafts skip, as before; marking one ready runs the workflow.
              core.setOutput('run', pr.draft ? 'false' : 'true');
              core.setOutput('base-ref', pr.base.ref);
              return;
            }

            // workflow_dispatch: pr-context has already checked the PR and warned if it is unusable.
            // Its head_sha is the commit this run was dispatched on, so every job measures that commit.
            if (process.env.PR_PRESENT !== 'true') {
              core.setOutput('run', 'false');
              return;
            }
            core.setOutput('pr-number', process.env.PR_NUMBER);
            core.setOutput('head-sha', process.env.PR_HEAD_SHA);
            core.setOutput('run', 'true');
            core.setOutput('base-ref', process.env.PR_BASE_REF);

  # Gate the heavy measurement jobs on whether any change could actually move bundle
  # sizes. This is a per-job gate (not a workflow-level `paths:` filter) on purpose: the
  # `status` job below is the required branch-protection check, and a path-filtered
  # workflow would leave that check stuck "Expected" and block merges. Instead the heavy
  # jobs skip and `status` treats skipped inputs as a pass.
  detect-changes:
    name: Detect Size-Relevant Changes
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    outputs:
      relevant: ${{ steps.filter.outputs.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Used on a manual run only (a pull_request reads the PR's file list): compare with the PR's
          # base rather than the repository default branch.
          base: ${{ needs.prepare.outputs.base-ref }}
          filters: |
            size:
              - 'packages/**'
              - 'community-modules/**'
              - 'yarn.lock'
              - 'nx.json'
              - 'tsconfig.*.json'
              # module-size measurement infrastructure
              - 'testing/module-size/**'
              - 'testing/module-size-angular/**'
              - '.github/workflows/module-size-comparison.yml'
              - '.github/actions/module-size-test/**'
              - 'scripts/ci/*module-size*'

  # Check for cached base results
  check-base-cache:
    name: Check Base Cache
    runs-on: ubuntu-latest
    needs: [prepare, detect-changes]
    if: needs.prepare.outputs.run == 'true' && needs.detect-changes.outputs.relevant == 'true'
    outputs:
      cache-hit: ${{ steps.cache-check.outputs.cache-hit }}
      base-sha: ${{ steps.get-merge-base.outputs.sha }}
    steps:
      - name: Checkout to find merge base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.head-sha }}
          fetch-depth: 0

      - name: Get merge base SHA
        id: get-merge-base
        run: |
          BASE_REF="${{ needs.prepare.outputs.base-ref }}"
          HEAD_SHA="${{ needs.prepare.outputs.head-sha }}"

          # Fetch the base branch
          git fetch origin ${BASE_REF}

          # Find the merge base (common ancestor)
          MERGE_BASE=$(git merge-base origin/${BASE_REF} ${HEAD_SHA})

          echo "sha=${MERGE_BASE}" >> $GITHUB_OUTPUT
          echo "Base branch: ${BASE_REF}"
          echo "PR head: ${HEAD_SHA}"
          echo "Merge base SHA: ${MERGE_BASE}"

      - name: Check cache for base results
        id: cache-check
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./base-results.json
          key: module-size-base-${{ steps.get-merge-base.outputs.sha }}
          lookup-only: true

  # Build and run module size tests on the PR branch (sharded)
  module-size-pr:
    name: Module Size PR (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: [prepare, detect-changes]
    if: needs.prepare.outputs.run == 'true' && needs.detect-changes.outputs.relevant == 'true'
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shard-matrix) }}
      fail-fast: false
    steps:
      - name: Checkout for actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.head-sha }}
          fetch-depth: 1

      - name: Run module size tests
        uses: ./.github/actions/module-size-test
        with:
          ref: ${{ needs.prepare.outputs.head-sha }}
          shard: ${{ matrix.shard }}
          total-shards: ${{ strategy.job-total }}
          artifact-prefix: module-size-pr
          artifact-suffix: ${{ needs.prepare.outputs.pr-number }}

  # Build and run module size tests on the merge base (sharded) - only if cache miss
  module-size-base:
    name: Module Size Base (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: [prepare, detect-changes, check-base-cache]
    if: needs.prepare.outputs.run == 'true' && needs.detect-changes.outputs.relevant == 'true' && needs.check-base-cache.outputs.cache-hit != 'true'
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shard-matrix) }}
      fail-fast: false
    steps:
      - name: Checkout for actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.head-sha }}
          fetch-depth: 1

      - name: Run module size tests
        uses: ./.github/actions/module-size-test
        with:
          ref: ${{ needs.check-base-cache.outputs.base-sha }}
          shard: ${{ matrix.shard }}
          total-shards: ${{ strategy.job-total }}
          artifact-prefix: module-size-base
          artifact-suffix: ${{ needs.prepare.outputs.pr-number }}
          base-ref: ${{ needs.prepare.outputs.base-ref }}
          actions-ref: ${{ needs.prepare.outputs.head-sha }}

  # Merge base shards and save to cache (only when we had to build)
  cache-base-results:
    name: Cache Base Results
    runs-on: ubuntu-latest
    needs: [prepare, check-base-cache, module-size-base]
    if: always() && needs.module-size-base.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci/merge-module-size-results.mjs

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Download all base shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: module-size-base-shard-*-${{ needs.prepare.outputs.pr-number }}
          path: ./base-shards
          merge-multiple: true

      - name: Merge shard results
        run: |
          node scripts/ci/merge-module-size-results.mjs ./base-shards ./base-results.json

      - name: Save to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./base-results.json
          key: module-size-base-${{ needs.check-base-cache.outputs.base-sha }}

  # Compare results and post PR comment
  compare-and-report:
    name: Compare & Report
    runs-on: ubuntu-latest
    needs: [prepare, check-base-cache, module-size-pr, module-size-base, cache-base-results]
    # Run if PR tests succeeded AND either cache hit OR base tests succeeded
    if: |
      always() &&
      needs.module-size-pr.result == 'success' &&
      (needs.check-base-cache.outputs.cache-hit == 'true' || needs.module-size-base.result == 'success')
    env:
      PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
      CACHE_HIT: ${{ needs.check-base-cache.outputs.cache-hit }}
      BASE_SHA: ${{ needs.check-base-cache.outputs.base-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci/compare-module-sizes.mjs
            scripts/ci/merge-module-size-results.mjs
            external/ag-shared/github/actions/pr-head-guard

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Download all PR shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: module-size-pr-shard-*-${{ env.PR_NUMBER }}
          path: ./pr-shards
          merge-multiple: true

      - name: Merge PR shard results
        run: |
          node scripts/ci/merge-module-size-results.mjs ./pr-shards ./pr-results.json

      # If cache hit, restore from cache
      - name: Restore base results from cache
        if: env.CACHE_HIT == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./base-results.json
          key: module-size-base-${{ env.BASE_SHA }}
          fail-on-cache-miss: true

      # If cache miss, download artifacts and merge
      - name: Download all base shard results
        if: env.CACHE_HIT != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: module-size-base-shard-*-${{ env.PR_NUMBER }}
          path: ./base-shards
          merge-multiple: true

      - name: Merge base shard results
        if: env.CACHE_HIT != 'true'
        run: |
          node scripts/ci/merge-module-size-results.mjs ./base-shards ./base-results.json

      - name: Compare module sizes
        id: compare
        run: |
          node scripts/ci/compare-module-sizes.mjs \
            ./base-results.json \
            ./pr-results.json \
            ./comparison-report.md

      # A manual run is slow: don't comment once the PR head has moved on (a newer run owns the
      # comment) or the PR has closed.
      - name: Check the PR head is current
        id: head
        uses: ./external/ag-shared/github/actions/pr-head-guard
        with:
          pr-number: ${{ env.PR_NUMBER }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing comment
        id: find-comment
        if: steps.head.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER, 10),
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## Module Size Comparison')
            );

            return botComment ? botComment.id : '';

      - name: Post or update comment
        if: steps.head.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_ID: ${{ steps.find-comment.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('./comparison-report.md', 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = parseInt(process.env.PR_NUMBER, 10);
            const comment_id = process.env.COMMENT_ID;

            const body = report + '\n\n---\n*Updated: ' + new Date().toISOString() + '*';

            if (comment_id) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: parseInt(comment_id, 10),
                body
              });
              console.log(`Updated comment ${comment_id}`);
            } else {
              const { data: comment } = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
              console.log(`Created comment ${comment.id}`);
            }

      - name: Upload comparison report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-size-comparison-${{ env.PR_NUMBER }}
          path: ./comparison-report.md
          retention-days: 30

  # Status check job - this is what branch protection should require
  # It ensures the workflow properly blocks PRs when jobs fail
  status:
    name: Module Size Status
    runs-on: ubuntu-latest
    needs: [prepare, detect-changes, check-base-cache, module-size-pr, module-size-base, compare-and-report]
    if: always() && needs.prepare.outputs.run == 'true'
    steps:
      - name: Check job results
        run: |
          echo "Checking job results..."
          echo "prepare: ${{ needs.prepare.result }}"
          echo "detect-changes: ${{ needs.detect-changes.result }} (relevant=${{ needs.detect-changes.outputs.relevant }})"
          echo "check-base-cache: ${{ needs.check-base-cache.result }}"
          echo "module-size-pr: ${{ needs.module-size-pr.result }}"
          echo "module-size-base: ${{ needs.module-size-base.result }}"
          echo "compare-and-report: ${{ needs.compare-and-report.result }}"

          # prepare must succeed
          if [[ "${{ needs.prepare.result }}" != "success" ]]; then
            echo "::error::prepare job failed"
            exit 1
          fi

          # No size-relevant changes: the heavy jobs are intentionally skipped and this
          # required check passes without a comparison. detect-changes must have run.
          if [[ "${{ needs.detect-changes.result }}" != "success" ]]; then
            echo "::error::detect-changes job failed"
            exit 1
          fi
          if [[ "${{ needs.detect-changes.outputs.relevant }}" != "true" ]]; then
            echo "No size-relevant changes detected — skipping module size comparison."
            exit 0
          fi

          # check-base-cache must succeed
          if [[ "${{ needs.check-base-cache.result }}" != "success" ]]; then
            echo "::error::check-base-cache job failed"
            exit 1
          fi

          # module-size-pr must succeed
          if [[ "${{ needs.module-size-pr.result }}" != "success" ]]; then
            echo "::error::module-size-pr job failed"
            exit 1
          fi

          # module-size-base must succeed or be skipped (skipped when cache hit)
          if [[ "${{ needs.module-size-base.result }}" != "success" && "${{ needs.module-size-base.result }}" != "skipped" ]]; then
            echo "::error::module-size-base job failed"
            exit 1
          fi

          # compare-and-report must succeed
          if [[ "${{ needs.compare-and-report.result }}" != "success" ]]; then
            echo "::error::compare-and-report job failed"
            exit 1
          fi

          echo "All required jobs completed successfully!"
