name: Grid E2E Tests
description: Run the real-browser Playwright e2e suite in testing/e2e on Chromium, Firefox and WebKit

env:
  # See doc-tests.yml: stops git's background gc/maintenance racing the shallow fetches in job setup.
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: gc.auto
  GIT_CONFIG_VALUE_0: '0'
  GIT_CONFIG_KEY_1: maintenance.auto
  GIT_CONFIG_VALUE_1: 'false'
  NX_NO_CLOUD: true
  CI: true
  DEFAULT_RETENTION_DAYS: 30
  PREV_COMMIT_SHA_FILE: ./commit-sha.txt
  CTRF_FILE: ./ctrf-report.json
  SLACK_CHANNEL: '#ci-grid-gate'
  AG_LIBRARY: grid
on:
  schedule:
    - cron: '30 3 * * *' # Daily at 3:30am UTC, an hour after doc-tests.yml. Deliberately not part of the PR CI.
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Browsers to run: all / chromium'
        type: choice
        options:
          - all
          - chromium
        required: true
        default: all
      test_pattern:
        description: 'Space-separated Playwright file patterns to run (empty = every spec)'
        type: string
        required: false
        default: ''
      notify:
        description: 'Notify Slack channel'
        type: boolean
        default: false
        required: true
      force_jira_ticket:
        description: 'Force create a Jira ticket even if the run is not scheduled'
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

jobs:
  grid-e2e:
    name: Grid e2e (${{ inputs.browsers || 'all' }} browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup
        uses: ./.github/actions/setup-nx
        with:
          cache_mode: rw
          yarn_postinstall: 'false'
          nx_restore: 'true'
          tidy_nx_cache: 'false'

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Bounded and retried via the shared wrapper (AG-18231): a stalled apt mirror fails this step instead of
      # hanging the job until the time limit cancels it, which would skip the report upload below. The cache
      # holds the browsers, not the OS libraries, so a hit only needs install-deps. The cache key is shared
      # with doc-tests.yml, which expects all three browsers in it, so a miss always installs all three.
      - name: Install Playwright browsers
        env:
          PW_BROWSERS: ${{ inputs.browsers == 'chromium' && 'chromium' || 'chromium firefox webkit' }}
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          PW_INSTALL="${GITHUB_WORKSPACE}/scripts/ci/install-playwright.sh"
          if [ "${PW_CACHE_HIT}" = "true" ]; then
            bash "${PW_INSTALL}" deps ${PW_BROWSERS}
          else
            bash "${PW_INSTALL}" full chromium firefox webkit
          fi

      # The gate builds the UMD bundles the specs load, runs Playwright, and writes the elapsed time to the
      # job summary.
      - name: Run grid e2e specs
        id: run
        env:
          TEST_PATTERN: ${{ inputs.test_pattern }}
          BROWSER_FLAG: ${{ inputs.browsers == 'chromium' && '--project=chromium' || '--all-browsers' }}
        run: ./grid-e2e.sh ${TEST_PATTERN} ${BROWSER_FLAG}

      - name: Upload Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-grid-e2e
          path: reports/
          retention-days: ${{ env.DEFAULT_RETENTION_DAYS }}

      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: ctrf-io/github-test-reporter@e500b992f936420eb633c91644cf10d4d71df700 # v1.1.0
        with:
          report-path: 'reports/ag-e2e-testing.json'
          summary-report: true
          flaky-report: true
          skipped-report: false
          group-by: filePath
          write-ctrf-to-file: ${{ env.CTRF_FILE }}

      - name: Summarise failed tests
        if: ${{ !cancelled() }}
        run: node documentation/ag-grid-docs/scripts/summarise-ctrf-failures.mjs ${{ env.CTRF_FILE }}

      - name: Get previous run commit SHA
        id: prev-commit-sha
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          restore-keys: |
            grid-e2e-prev-commit-
            grid-e2e-prev-commit-${{ github.ref }}
          path: ${{ env.PREV_COMMIT_SHA_FILE }}
          key: grid-e2e-prev-commit-${{ github.ref }}-${{ github.sha }}

      - name: Load files into environment
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ -f ${{ env.PREV_COMMIT_SHA_FILE }} ]; then
          {
             echo 'PREV_COMMIT_SHA<<EOF'
             cat ${{ env.PREV_COMMIT_SHA_FILE }}
             echo 'EOF'
          } >> $GITHUB_ENV
          else
            echo 'PREV_COMMIT_SHA_FILE not found'
          fi

      - name: Slack Notification
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.notify) }}
        continue-on-error: true
        uses: ./external/ag-shared/github/actions/slack-integration
        with:
          AG_LIBRARY: ${{ env.AG_LIBRARY }}
          CTRF_REPORT_FILE: ${{ env.CTRF_FILE }}
          SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
          SLACK_CHANNEL: ${{ env.SLACK_CHANNEL }}
          PREV_COMMIT_SHA: ${{ env.PREV_COMMIT_SHA }}
          CURRENT_COMMIT_SHA: ${{ github.sha }}
          IS_SUCCESS: ${{ steps.run.outcome == 'success' }}

      - name: Create Jira Ticket
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.force_jira_ticket) }}
        uses: ./.github/actions/jira-integration
        continue-on-error: true
        with:
          JIRA_API_AUTH: ${{ secrets.JIRA_API_AUTH }}
          JIRA_SUMMARY: "[NR] CI/CD workflow '${{ github.workflow }}' is failing."
          CTRF_REPORT_FILE: ${{ env.CTRF_FILE }}
          PREV_COMMIT_SHA: ${{ env.PREV_COMMIT_SHA }}
          CURRENT_COMMIT_SHA: ${{ github.sha }}
          IS_SUCCESS: ${{ steps.run.outcome == 'success' }}

      - name: Set commit SHA
        id: set-commit-sha
        if: ${{ !cancelled() }}
        run: echo ${{ github.sha }} > ${{ env.PREV_COMMIT_SHA_FILE }}

      - name: Save Current Commit Hash
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PREV_COMMIT_SHA_FILE }}
          key: ${{ steps.prev-commit-sha.outputs.cache-primary-key }}
