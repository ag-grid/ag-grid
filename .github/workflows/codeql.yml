name: 'CodeQL Advanced'

on:
    push:
        branches: ['latest', 'b[0-9][0-9].[0-9].[0-9]', 'lts']
    pull_request:
        branches: ['latest', 'b[0-9][0-9].[0-9].[0-9]', 'lts']
        types: [opened, synchronize, reopened, ready_for_review]

env:
    # Disable git's post-fetch background gc/maintenance for every git invocation in this
    # workflow (via git's GIT_CONFIG_* protocol); otherwise it rewrites .git/shallow
    # concurrently with the next chained `git fetch --depth 1`, intermittently failing job
    # setup with "fatal: shallow file has changed since we read it". Fixed in git >= 2.55.
    GIT_CONFIG_COUNT: 2
    GIT_CONFIG_KEY_0: gc.auto
    GIT_CONFIG_VALUE_0: '0'
    GIT_CONFIG_KEY_1: maintenance.auto
    GIT_CONFIG_VALUE_1: 'false'

# Least-privilege default; the analyze job overrides this with its own block.
permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: 'ubuntu-latest'
        permissions:
            # required for all workflows
            security-events: write

            # required to fetch internal or private CodeQL packs
            packages: read

            # only required for workflows in private repositories
            actions: read
            contents: read

        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      build-mode: none

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1 # shallow copy

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: 'ro'
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref || 'latest' }}

            - name: nx pack:verify
              id: pack-verify
              if: steps.setup.outputs.type != 'pr'
              run: |
                  yarn nx pack:verify --prod

            - name: Initialize CodeQL (PR)
              uses: github/codeql-action/init@v4
              if: steps.setup.outputs.type == 'pr'
              with:
                  config-file: ./.github/codeql/codeql-config-pr.yml
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  trap-caching: false

            - name: Initialize CodeQL (latest)
              uses: github/codeql-action/init@v4
              if: steps.setup.outputs.type != 'pr'
              with:
                  config-file: ./.github/codeql/codeql-config-latest.yml
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  trap-caching: false

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:${{matrix.language}}'
