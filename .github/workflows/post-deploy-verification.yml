name: Post-Deploy Page Verification

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['latest']
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'URL to test against (leave blank to use the staging URL from baseUrlUtils.js)'
        required: false
        default: ''
      csp_dry_run:
        description: 'Log the CSP Slack message instead of posting it'
        required: false
        type: boolean
        default: false

env:
  CI: true
  YARN_REGISTRY: 'https://registry.ag-grid.com'

concurrency:
  group: post-deploy-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  # read is sufficient: the actions-scope consumers are `gh run list`, the per-run jobs API
  # that reads the verification step's own conclusion, and the previous run's artifact
  # download, all read-only.
  actions: read
  # Lets the Slack notification resolve the commits since the last verified run back to the
  # pull requests that carried them, so it can name them and their authors.
  pull-requests: read

jobs:
  page-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Page Verification (Staging)
    # For manual dispatch: always run.
    # For workflow_run: only proceed if triggered by a push to this repo (not a fork PR),
    # and only if the upstream CI run succeeded. This guards against the untrusted-checkout
    # risk flagged by OSSF/Scorecard for workflow_run triggers.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the default-branch HEAD (github.sha). In a workflow_run
          # context this is the branch the run was triggered on; combined with the
          # job-level `if:` (same-repo push only), the deployed commit is at HEAD.
          # Avoid referencing workflow_run.head_sha here: it is an untrusted-input
          # pattern flagged by OSSF/Scorecard for privileged workflow_run checkouts.
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install Playwright
        run: |
          npm init -y --prefix /tmp/pw
          npm install --prefix /tmp/pw @playwright/test@1.63.0 playwright-ctrf-json-reporter@0.0.29
          ln -s /tmp/pw/node_modules documentation/ag-grid-docs/node_modules
          /tmp/pw/node_modules/.bin/playwright install chromium --with-deps

      - name: Resolve staging URL
        id: staging_url
        run: |
          URL=$(node -e "
            const { getBaseUrl } = require('./scripts/deployments/prep_and_archive/baseUrlUtils');
            console.log(getBaseUrl({ env: 'staging' }).baseUrl);
          ")
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Resolved staging URL: ${URL}"

      - name: Run page verification tests
        id: run_tests
        working-directory: documentation/ag-grid-docs
        env:
          BASE_URL: ${{ inputs.staging_url || steps.staging_url.outputs.url }}
        run: /tmp/pw/node_modules/.bin/playwright test --project=page-verification

      - name: Publish CTRF Report
        if: always()
        uses: ctrf-io/github-test-reporter@e500b992f936420eb633c91644cf10d4d71df700 # v1.1.0
        with:
          report-path: 'reports/ag-grid-examples-interactive-default.json'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: page-verification-results
          path: |
            reports/
            documentation/ag-grid-docs/test-results/
          retention-days: 14

      # Kept as its own artifact so the csp-report job can pull just this file from the
      # previous run to compare against, rather than a bundle carrying every trace. A run
      # against a hand-given URL is not uploaded: it would become the next run's baseline
      # while describing a different site.
      - name: Upload CSP report
        if: always() && inputs.staging_url == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csp-violations
          path: reports/ag-grid-csp-violations.json
          if-no-files-found: warn
          retention-days: 30

      - name: Check previous run status
        id: prev_run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Both answers below describe the verification suite itself, taken from the conclusion of
          # the step that runs it rather than from the run's own. A run aggregates the non-gating
          # CSP job, and a run that died before the suite started notified nobody, so its conclusion
          # cannot say whether the site was verified or whether the channel was told. `outcome`
          # comes from the last run that reached a verdict, which decides both whether the channel
          # is owed a back-to-green message and whether this failure is a repeat of one already
          # reported; `sha` comes from the last run that passed, so the range it anchors holds every
          # commit not yet seen green. Both describe the automatic staging verification only: a
          # manual dispatch can point the suite at a hand-given URL, so its result says nothing
          # about staging and must not stand in as either one. The current run is still in_progress,
          # so --status completed only ever sees earlier ones, and the limit is generous because the
          # run that last passed is furthest away precisely when the range it anchors has the most
          # commits to name.
          RUNS=$(gh run list \
            --workflow post-deploy-verification.yml \
            --branch latest \
            --event workflow_run \
            --status completed \
            --limit 100 \
            --json databaseId,headSha)

          OUTCOME=""
          SHA=""
          INSPECTED=0
          # One API call per run, newest first, stopping at the last pass because no older run can
          # change either answer. The cap bounds a long red period, or a list that never passed, to
          # twenty calls.
          for ROW in $(echo "$RUNS" | jq -r '.[] | "\(.databaseId):\(.headSha)"'); do
            if [ "$INSPECTED" -ge 20 ]; then
              echo "::warning title=Previous run status::Inspected $INSPECTED runs without finding one that passed verification, so this run's PR range is not anchored."
              break
            fi
            INSPECTED=$((INSPECTED + 1))
            RUN_ID=${ROW%%:*}
            RUN_SHA=${ROW##*:}
            # A run holds several jobs; only the verification job carries this step.
            STEP=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
              --jq '[.jobs[].steps[]? | select(.name == "Run page verification tests") | .conclusion]
                    | map(select(. == "success" or . == "failure")) | first // empty') || continue
            if [ -z "$STEP" ]; then
              continue
            fi
            if [ -z "$OUTCOME" ]; then
              OUTCOME=$STEP
            fi
            if [ "$STEP" = "success" ]; then
              SHA=$RUN_SHA
              break
            fi
          done

          echo "outcome=$OUTCOME" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Notify Slack
        # Always notify on failure. On success, only notify if the previous run
        # failed - a "back to green" signal - so a routine passing run doesn't
        # spam the channel.
        #
        # Only ever for latest. The channel watches the deployed site, and a run from a topic
        # branch is somebody exercising this workflow or a candidate build, so its result says
        # nothing the channel can act on. Those runs log the outcome instead, in the step below.
        # `workflow_run` is filtered to latest and reports the default branch as its ref, so in
        # practice this only excludes a `workflow_dispatch` from a branch.
        if: >
          always() && github.ref_name == 'latest' &&
          (steps.run_tests.outcome == 'failure' ||
           (steps.run_tests.outcome == 'success' && steps.prev_run.outputs.outcome == 'failure'))
        uses: ./external/ag-shared/github/actions/slack-integration
        with:
          AG_LIBRARY: grid
          SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
          SLACK_CHANNEL: '#teamcity_status'
          CTRF_REPORT_FILE: reports/ag-grid-examples-interactive-default.json
          CURRENT_COMMIT_SHA: ${{ github.sha }}
          PREV_COMMIT_SHA: ${{ steps.prev_run.outputs.sha }}
          IS_SUCCESS: ${{ steps.run_tests.outcome == 'success' }}
          # One break notifies the channel in full once. While the suite stays red every further
          # run posts the header and the test counts only, with no PR attribution and no second
          # round of @-mentions for the people who were told the first time.
          IS_REPEAT_FAILURE: ${{ steps.run_tests.outcome == 'failure' && steps.prev_run.outputs.outcome == 'failure' }}
          # Names the PRs between the last verified run and this one, and @-mentions their
          # authors on a failure, so a break reaches whoever landed it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_API_TOKEN: ${{ secrets.SLACK_USER_CONFIG_NOTION_API_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.SLACK_USER_CONFIG_NOTION_DATA_SOURCE_ID }}

      # The counterpart to the step above: off latest the outcome still has to be visible, just
      # to whoever dispatched the run rather than to the channel. The job's own conclusion is
      # untouched either way, so a failure here is still a red run.
      - name: Log verification result
        if: always() && github.ref_name != 'latest'
        env:
          CTRF_REPORT_FILE: reports/ag-grid-examples-interactive-default.json
          OUTCOME: ${{ steps.run_tests.outcome }}
        run: |
          {
            echo "### Page verification: \`${OUTCOME}\`"
            echo
            echo "Ref \`${GITHUB_REF_NAME}\` is not \`latest\`, so no Slack notification was sent."
            echo
            if [ -f "${CTRF_REPORT_FILE}" ]; then
              jq -r '
                .results.summary as $s
                | "Tests: \($s.tests) — passed \($s.passed), failed \($s.failed), skipped \($s.skipped)",
                  "",
                  (
                    [.results.tests[] | select(.status != "passed")]
                    | if length == 0 then "No failing tests recorded."
                      else "Not passed:", (.[] | "- `\(.status)` \(.name)")
                      end
                  )
              ' "${CTRF_REPORT_FILE}"
            else
              echo "No CTRF report at \`${CTRF_REPORT_FILE}\`, so there is nothing to summarise."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # CSP violations are reported, not gated: a hash in the site policy goes stale whenever a tag
  # is edited in Google Tag Manager, which breaks no page but does need fixing. Keeping this out
  # of the verification job means the team that owns the policy hears about it without the
  # regular channel seeing a failure nobody there can act on.
  csp-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: CSP Report (non-gating)
    needs: page-verification
    # Report whatever the run observed, whether or not the page assertions passed. A skipped or
    # cancelled verification job has nothing to report.
    if: >
      always() &&
      needs.page-verification.result != 'skipped' &&
      needs.page-verification.result != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Download CSP report
        # Tolerated: the suite can die before writing one, and that failure is the
        # verification job's to report.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: csp-violations
          path: csp/current

      - name: Download previous CSP report
        # The baseline has to be a run that actually produced a report, so this walks back
        # over recent successful runs rather than trusting the newest: a dispatch against a
        # hand-given URL succeeds without uploading one, and a run predating this job has
        # none at all. Once the artifact is known to exist, a failed download is a real
        # error, so it fails this job rather than quietly reporting the site as all-new.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # The workflow run is still in progress, so this cannot select the current run.
          CANDIDATES=$(gh run list \
            --workflow post-deploy-verification.yml \
            --branch latest \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId')

          BASELINE=""
          for ID in $CANDIDATES; do
            if ! ARTIFACTS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ID/artifacts" \
              --jq '.artifacts[] | select(.expired == false) | .name'); then
              echo "::warning title=CSP baseline::Could not list artifacts for run $ID; skipping it."
              continue
            fi
            if grep -qx csp-violations <<<"$ARTIFACTS"; then
              BASELINE=$ID
              break
            fi
          done

          if [ -z "$BASELINE" ]; then
            echo "No recent successful run has a csp-violations artifact; treating this run as having no baseline."
            exit 0
          fi

          gh run download "$BASELINE" \
            --repo "$GITHUB_REPOSITORY" \
            --name csp-violations \
            --dir csp/previous
          echo "Comparing against run $BASELINE."

      - name: Report CSP violations
        env:
          CSP_REPORT_FILE: csp/current/ag-grid-csp-violations.json
          PREVIOUS_CSP_REPORT_FILE: csp/previous/ag-grid-csp-violations.json
          PROJECT_TITLE: AG Grid
          SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
          SLACK_CHANNEL: '#dev-ops-status'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.csp_dry_run || false }}
          # A run that failed part way through sees fewer violations than the site has, which
          # would otherwise read as a policy being fixed.
          RUN_COMPLETE: ${{ needs.page-verification.result == 'success' }}
        run: node ./external/ag-shared/scripts/slack/notify-csp-violations.mjs
