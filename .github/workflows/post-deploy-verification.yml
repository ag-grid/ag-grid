name: Post-Deploy Page Verification

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['latest']
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'URL to test against (leave blank to use the staging URL from baseUrlUtils.js)'
        required: false
        default: ''

env:
  CI: true
  YARN_REGISTRY: 'https://registry.ag-grid.com'

permissions:
  contents: read
  actions: write

jobs:
  page-verification:
    runs-on: ubuntu-latest
    name: Page Verification (Staging)
    # For workflow_run: only proceed if the CI workflow that triggered us succeeded.
    # For manual dispatch: always run.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin to the commit that was actually deployed, not HEAD.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Resolve staging URL
        id: staging_url
        run: |
          URL=$(node -e "
            const { getBaseUrl } = require('./scripts/deployments/prep_and_archive/baseUrlUtils');
            console.log(getBaseUrl({ env: 'staging' }));
          ")
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Resolved staging URL: ${URL}"

      - name: Setup
        uses: ./.github/actions/setup-nx
        with:
          cache_mode: ro
          fetch_base: skip

      - name: Install Playwright Chromium
        working-directory: documentation/ag-grid-docs
        run: npx playwright install chromium --with-deps

      - name: Run page verification tests
        working-directory: documentation/ag-grid-docs
        env:
          BASE_URL: ${{ inputs.staging_url || steps.staging_url.outputs.url }}
        run: npx playwright test src/content/docs/page-verification.spec.ts --project=chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-verification-results
          path: reports/
          retention-days: 14

      - name: Notify Slack
        if: always()
        uses: ./external/ag-shared/github/actions/slack-integration
        with:
          AG_LIBRARY: grid
          SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
          SLACK_CHANNEL: '#teamcity_status'
          CTRF_REPORT_FILE: reports/ag-grid-examples-interactive-default.json
          CURRENT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          IS_SUCCESS: ${{ job.status == 'success' }}
