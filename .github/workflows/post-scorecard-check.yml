name: OSS Scorecard Results Check
on:
  push:
    branches:
      - 'post-scorecard-check'
  workflow_dispatch:
  workflow_run:
    workflows: [ 'OSS Scorecard' ]
    types:
      - completed

env:
  CTRF_FILE: ./ctrf-report.json
  SLACK_CHANNEL: '#ci-grid-gate'
  AG_LIBRARY: grid
  THRESHOLD: 7.0

permissions: read-all

jobs:
  check_results:
    name: Scorecard Results Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout:
            'external/ag-shared/scripts/ossf-scorecard/getAndCheckResults.mjs'

      - name: "Check Results"
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          result-encoding: string
          script: |
            async function exec() {
                const {
                    belowThreshold
                } = require('./external/ag-shared/scripts/ossf-scorecard/getAndCheckResults.mjs');
            
                const result = await belowThreshold(
                    process.env.AG_LIBRARY,
                    process.env.THRESHOLD
                );
            
                console.log(result);
            }

            await exec();
