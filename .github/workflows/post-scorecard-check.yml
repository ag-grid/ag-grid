name: OSS Scorecard Results Check
on:
  push:
    branches:
      - 'post-scorecard-check'
  workflow_dispatch:
  workflow_run:
    workflows: [ 'OSS Scorecard' ]
    types:
      - completed

env:
  CTRF_FILE: ./ctrf-report.json
  SLACK_CHANNEL: '#ci-grid-gate'
  AG_LIBRARY: grid
  THRESHOLD: 7.0
  REPORT_FILE: ./crsf-report.json

permissions: read-all

jobs:
  check_results:
    name: Scorecard Results Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout:
            'external/ag-shared/scripts/ossf-scorecard/getAndCheckResults.mjs'

      - name: "Check Results"
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          result-encoding: string
          script: |
            const fs = require('fs');

            async function exec() {
                const {
                    belowThreshold
                } = require('./external/ag-shared/scripts/ossf-scorecard/getAndCheckResults.mjs');
            
                const result = await belowThreshold(
                    process.env.AG_LIBRARY,
                    process.env.THRESHOLD
                );
            
                const passed = result;
                const failed = !result;
                const skipped = 0;

                const report = { results: { summary: { failed, passed, skipped } } };
                fs.writeFileSync('${{ env.REPORT_FILE }}', JSON.stringify(report));
            }

            await exec();

      - name: Test
        run: |
          if [ -f "${{ env.REPORT_FILE }}" ]; then
            echo "Report file exists."
          else
            echo "Report file does not exist."
            exit 1
          fi
          cat ${{ env.REPORT_FILE }}
