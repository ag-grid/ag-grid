name: OSS Scorecard Results Check
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ 'OSS Scorecard' ]
    types:
      - completed

env:
  SLACK_CHANNEL: '#ci-grid-gate'
  AG_LIBRARY: grid
  THRESHOLD: 7.3
  SCORECARD_FILE: ./scorecard.json
  REPORT_FILE: ./ctrf-report.json

permissions:
  contents: read
  # read is sufficient: the only actions-scope consumer is the previous-run lookup below.
  actions: read

jobs:
  check_results:
    name: Scorecard Results Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1 # shallow copy

      # NOTE: This is done outside of the `scorecard` workflow as there are restrictions on `ossf/scorecard-action`
      - name: "Check Results"
        id: check_results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          result-encoding: string
          script: |
            const fs = require("fs");

            async function exec() {
              const {
                getOSSFScorecardResults,
              } = require("./external/ag-shared/scripts/ossf-scorecard/getAndCheckResults.mjs");
              const {
                generateScorecardSummaryMarkdown,
              } = require("./external/ag-shared/scripts/ossf-scorecard/generateGithubSummary.mjs");

              const project = process.env.AG_LIBRARY;
              const threshold = process.env.THRESHOLD;

              const { results, report, hasPassed } = await getOSSFScorecardResults({ project, threshold });

              const messageType = hasPassed ? '::notice' : '::error';
              console.log(`${messageType}::Scorecard score for ${project}: ${results.score} (threshold = ${threshold})`);

              fs.writeFileSync("${{ env.REPORT_FILE }}", JSON.stringify(report));
              fs.writeFileSync("${{ env.SCORECARD_FILE }}", JSON.stringify(results));

              if (process.env.GITHUB_STEP_SUMMARY) {
                const markdown = generateScorecardSummaryMarkdown({ results, threshold, project, hasPassed });
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown + "\n");
              }

              // Exit with a numeric code to signal step success/failure to GitHub Actions
              process.exit(hasPassed ? 0 : 1);
            }

            await exec();

      - name: Persist scorecard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
            name: oss-scorecard-results
            path: ${{ env.REPORT_FILE }}

      - name: Persist scorecard response
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
            name: oss-scorecard-response
            path: ${{ env.SCORECARD_FILE }}

      - name: Publish CTRF Report
        uses: ctrf-io/github-test-reporter@e500b992f936420eb633c91644cf10d4d71df700 # v1.1.0
        if: always()
        with:
          report-path: '${{ env.REPORT_FILE }}'

      - name: Check previous run status
        id: prev_run
        if: steps.check_results.outcome == 'success'
        # A flaky `gh` call here must never redden a run whose check passed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_RUN_ATTEMPT}" -ge 2 ]]; then
            # A re-run's own earlier attempt is directly queryable, unlike the
            # completed-run listing below (which only sees prior runs).
            PREV_CONCLUSION=$(gh api \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/$((GITHUB_RUN_ATTEMPT - 1))" \
              --jq '.conclusion // ""' || true)
          else
            # Filtered here rather than with --branch/--status, which have been seen to omit
            # recent runs. Skips cancelled/skipped runs to take the last real verdict.
            PREV_CONCLUSION=$(gh run list \
              --workflow post-scorecard-check.yml \
              --limit 20 \
              --json headBranch,status,conclusion \
              --jq '[.[] | select(.headBranch == "${{ github.ref_name }}" and .status == "completed" and (.conclusion == "success" or .conclusion == "failure"))][0].conclusion // ""' || true)
          fi

          echo "conclusion=${PREV_CONCLUSION}" >> "$GITHUB_OUTPUT"

      - name: Slack Notification
        # Always notify on failure. On success, only notify if the previous run failed - a
        # "back to green" signal - so a routine passing run doesn't spam the channel.
        if: >
          success() &&
          (steps.check_results.outcome == 'failure' ||
           steps.prev_run.outputs.conclusion == 'failure')
        uses: ./external/ag-shared/github/actions/slack-integration
        with:
          AG_LIBRARY: ${{ env.AG_LIBRARY }}
          CTRF_REPORT_FILE: ${{ env.REPORT_FILE }}
          SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
          SLACK_CHANNEL: ${{ env.SLACK_CHANNEL }}
          IS_SUCCESS: ${{ steps.check_results.outcome != 'failure' }}

      - name: Fail job if scan failed
        shell: bash
        if: success() && steps.check_results.outcome == 'failure'
        run: |
            echo "Workflow failed, failing the build."
            exit 1
